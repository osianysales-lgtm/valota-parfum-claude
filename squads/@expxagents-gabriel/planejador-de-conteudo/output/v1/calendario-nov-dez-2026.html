body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}

.modal h2{font-family:Georgia,serif;font-weight:400;font-size:26px;margin:10px 0 4px;line-height:1.2}
.meta{font-size:13px;color:var(--muted);margin-bottom:18px}

.sec p{margin:0;white-space:pre-line;font-size:14.5px;line-height:1.55}
.slide{border-top:1px dashed var(--line);padding:10px 0}
.slide:first-of-type{border-top:none;padding-top:2px}
.slide .sn{font-size:11px;color:var(--muted)}
.slide .st{font-weight:600;font-size:14.5px;margin:2px 0}
.slide .sx{font-size:14px;line-height:1.5;color:#3a352f}
@media (max-width:760px){

 .dow,.day.empty,.day.nopost{display:none}
 .day{min-height:auto}
 h1{font-size:26px;min-width:0}
}

const POSTS = /*DADOS*/[{"date": "2026-11-09", "time": "19:30", "fmt": "Vídeo", "pilar": "Perfume certo na hora certa", "title": "O erro que faz seu perfume sumir em 2 horas", "objetivo": "Abrir o período com conteúdo útil que gera salvamento e mostra que a Valota entende do assunto.", "gancho": "(frasco do Bleu na mão) \"Seu perfume não é fraco. Você que tá passando errado.\"", "orientacoes": "Plano médio, frasco na mão, luz de janela. Cada erro com um gesto (esfregar o pulso com um X vermelho na tela). Texto na tela: ERRO 1 / ERRO 2 / ERRO 3. Duração de 30 a 40s, corte a cada frase.", "roteiro": "Seu perfume não é fraco. Você que tá passando errado.\n\nErro 1: esfregar o pulso depois de borrifar. Isso esquenta a pele e acaba com a saída do perfume. Borrifa e deixa secar.\n\nErro 2: passar na pele seca. Pele seca bebe perfume. Um hidratante sem cheiro antes e ele dura bem mais.\n\nErro 3: passar só no pulso. Você lava a mão o dia inteiro. Pescoço, nuca e peito seguram melhor. Um borrifo na roupa também ajuda, só cuidado com tecido claro.\n\nEu uso 4 borrifadas de Bleu de Chanel Parfum: duas no pescoço, uma na nuca, uma no peito.\n\nQual desses você comete? Me conta aqui embaixo.", "legenda": "3 erros que fazem o perfume sumir rápido. O 2º quase todo mundo comete. Salva pra lembrar antes de sair.\n#perfume #perfumemasculino #perfumaria #dicasdeperfume", "weekday": "Seg"}, {"date": "2026-11-11", "time": "20:00", "fmt": "Vídeo", "pilar": "Coleção Valota", "title": "Tenho 26 perfumes. Se só pudesse salvar 3…", "objetivo": "Apresentar a coleção e a autoridade de quem testou muita coisa (estilo Matheus Ueta). É o vídeo que explica por que seguir o perfil.", "gancho": "\"Tenho 26 perfumes. A casa pegou fogo e eu só posso salvar 3.\"", "orientacoes": "Abra com uma panorâmica de 2s mostrando a coleção inteira. Depois pegue um frasco de cada vez. Dá pra gravar em frente à prateleira. Duração de 40 a 50s.", "roteiro": "Tenho 26 perfumes. A casa pegou fogo e eu só posso salvar 3.\n\nPrimeiro: Bleu de Chanel Parfum. O mais versátil que eu tenho. Vai do trabalho ao jantar sem errar.\n\nSegundo: Basso, da Sospiro. Meu único nicho, e dá pra sentir o motivo. Fixa o dia inteiro e não lembra nada que você já cheirou.\n\nTerceiro: The One, da Dolce. Não é o mais forte, mas é o que eu mais uso pra sair à noite. Quente, perto da pele.\n\nFicaram de fora Sauvage, Code, Born in Roma… doeu.\n\nAqui na Valota eu falo de nicho, grife e árabe sem rodeio. Quais 3 você salvaria da sua coleção?", "legenda": "26 perfumes, só 3 sobrevivem. Concorda com o pódio?\n#perfumes #colecaodeperfumes #perfumedenicho #perfumemasculino", "recomendacoes": "Se quiser, use o título \"Perfume que eu salvaria de um incêndio\" como texto fixo na tela.", "weekday": "Qua"}, {"date": "2026-11-13", "time": "19:30", "fmt": "Carrossel", "pilar": "Vale ou não vale?", "title": "3 verdades sobre perfume árabe que ninguém te conta", "objetivo": "Gerar confiança com honestidade sobre árabes e preparar o teste às cegas de segunda.", "slides": [["3 verdades sobre perfume árabe que ninguém te conta", "Tenho 3 na coleção. Gosto deles. Mesmo assim:"], ["1. Fixar muito não é o mesmo que cheirar bem", "O Asad fixa o dia todo, fácil. Mas em lugar fechado, 5 borrifadas viram incômodo. Com árabe, 2 ou 3 bastam."], ["2. Nem todo \"inspirado\" é parecido", "Muitos lembram o original só na saída. A diferença aparece depois de 2 horas. Teste no braço antes de dizer que é igual."], ["3. Preço baixo demais é alerta", "Árabe original tem lacre, lote e registro na Anvisa. Se o preço está muito abaixo das lojas grandes, desconfie."], ["Então vale a pena?", "Vale. O Fakhar Black é um dos que eu mais uso no dia a dia. Só compre sabendo o que esperar."], ["Segunda tem teste às cegas", "Fakhar Black x YSL Y. Será que eu acerto? Segue pra ver."]], "legenda": "Gosto de árabe, mas quase ninguém fala dessas 3 coisas. Qual você aprendeu do jeito difícil?\n#perfumearabe #lattafa #perfumemasculino #perfumaria", "recomendacoes": "Fotos reais dos seus 3 árabes (Asad, Fakhar Black, Attar Al Wesal). Fundo creme e texto grande, como no seu guia.", "weekday": "Sex"}, {"date": "2026-11-16", "time": "20:00", "fmt": "Vídeo", "pilar": "Na prova", "title": "Teste às cegas: Fakhar Black x YSL Y EDP", "objetivo": "O primeiro grande teste do perfil. Comparação real, que gera comentário, compartilhamento e pedido de parte 2.", "gancho": "(de olhos vendados) \"Esse árabe custa uma fração do YSL Y. De olhos vendados, será que eu consigo diferenciar?\"", "orientacoes": "Precisa de alguém pra borrifar sem contar qual é qual (braço A e braço B). Câmera fixa. Close na hora de tirar a venda. Grave o resultado real, acertando ou errando. Faça um corte com a atualização depois de 2h. Duração de 50 a 60s.", "roteiro": "Esse árabe custa uma fração do YSL Y. De olhos vendados, será que eu consigo diferenciar?\n\n(cheira o braço A) Saída fresca, maçã… adocicado.\n\n(cheira o braço B) Parecido. Mas esse parece mais limpo, mais herbal.\n\nMeu chute: o [A/B] é o YSL. (tira a venda)\n\n[REAÇÃO REAL: acertou ou errou]\n\n(corte, 2h depois) Na saída eles são muito parecidos. A diferença aparece agora: [DESCREVER O QUE VOCÊ SENTIU].\n\nVeredito: se você quer o estilo do Y sem pagar o preço do Y, o Fakhar Black resolve no dia a dia. Se faz questão do acabamento, [CONCLUSÃO REAL].\n\nQual dupla você quer ver no próximo teste?", "legenda": "Teste às cegas: Fakhar Black (Lattafa) x YSL Y EDP. Fui bem? 👀\n#perfumearabe #ysl #testeascegas #lattafa #perfumemasculino", "recomendacoes": "Não ensaie o resultado: a graça está na reação real. Os trechos entre [ ] você completa depois de gravar.", "weekday": "Seg"}, {"date": "2026-11-18", "time": "19:30", "fmt": "Vídeo", "pilar": "Perfume certo na hora certa", "title": "1 perfume pra trabalho, date e balada", "objetivo": "Guia prático e fácil de salvar. Mostra o acervo aplicado a situações reais.", "gancho": "\"Se você só pudesse ter 3 perfumes, eu montaria assim:\"", "orientacoes": "Três looks com corte rápido entre eles (camisa social, jaqueta, roupa de festa). Nome do perfume e da ocasião na tela. Duração de 30 a 40s.", "roteiro": "Se você só pudesse ter 3 perfumes, eu montaria assim:\n\nTrabalho: Bleu de Chanel Parfum. Limpo, elegante, ninguém reclama em sala fechada. 4 borrifadas e pronto.\n\nDate: The One, da Dolce. Projeção baixa de propósito. Quem sente é quem chega perto.\n\nBalada: Invictus Absolu. Doce e forte, chega antes de você. Aqui pode exagerar um pouco.\n\nCom esses 3 você cobre quase tudo. Quer a versão árabe desse trio? Comenta \"árabe\" que eu faço.", "legenda": "Trabalho, date e balada: um perfume pra cada. Qual você trocaria?\n#perfumemasculino #bleudechanel #invictus #theone", "weekday": "Qua"}, {"date": "2026-11-20", "time": "20:00", "fmt": "Carrossel", "pilar": "Coleção Valota", "title": "Tier list dos meus 18 perfumes de grife", "objetivo": "Conteúdo de opinião que gera debate nos comentários (o formato de tier list do Matheus Ueta).", "slides": [["Tier list dos meus 18 perfumes de grife", "Minha opinião. Sem patrocínio."], ["S: compraria de novo amanhã", "Bleu de Chanel Parfum · Dior Sauvage Parfum · Armani Code Parfum · YSL Y Le Parfum"], ["A: excelentes", "Polo 67 EDP · D&G The One EDT · Born in Roma Intense · Acqua di Giò Parfum · YSL Y EDP"], ["B: bons, com ressalva", "Invictus Absolu · Scandal Le Parfum · YSL MYSLF · CH Men · 212 VIP Black · L'Eau d'Issey Intense · Le Male"], ["C: não compraria de novo", "Ferrari Black · Light Blue Capri in Love"], ["Discorda?", "Comenta qual você subiria ou desceria de tier."]], "legenda": "Tier list sincera dos meus perfumes de grife. O C vai dar briga.\n#tierlist #perfumes #perfumemasculino #dior #chanel", "recomendacoes": "⚠️ Os tiers foram montados a partir do Top 10 e das notas do seu Guia Olfativo. Ajuste com a sua opinião real antes de postar. Use as fotos dos frascos em cada slide.", "weekday": "Sex"}, {"date": "2026-11-23", "time": "19:30", "fmt": "Vídeo", "pilar": "Vale ou não vale?", "title": "Comprei pelo hype: valeu ou me arrependi?", "objetivo": "Opinião sincera sobre um viral. Mostra que a Valota não repete o hype e tem opinião própria.", "gancho": "(frasco na mão) \"Esse aqui eu comprei só porque o TikTok inteiro tava falando dele.\"", "orientacoes": "⚠️ Defina o perfume (que você comprou por causa do hype). Fale olhando pra câmera, sem roteiro decorado: só os tópicos. Duração de 35 a 45s.", "roteiro": "Esse aqui eu comprei só porque o TikTok inteiro tava falando dele. [PERFUME]\n\nPrometiam [O QUE VOCÊ VIU PROMETEREM: fixação de 24h, elogio garantido, \"cheiro de rico\"…].\n\nUsei por [TEMPO].\n\nO que é verdade: [PONTO POSITIVO REAL].\n\nO que é exagero: [PONTO NEGATIVO REAL].\n\nVeredito: [VALEU / NÃO VALEU] e eu recomendaria pra [PERFIL DE PESSOA].\n\nQual você comprou pelo hype e se arrependeu?", "legenda": "Comprei pelo hype. Valeu? Sinceridade total.\n#perfumeviral #hype #perfumes #opiniaosincera", "recomendacoes": "Os trechos entre [ ] têm que vir da sua experiência real. Não invente promessa nem resultado.", "weekday": "Seg"}, {"date": "2026-11-25", "time": "20:00", "fmt": "Vídeo", "pilar": "Na prova", "title": "O \"Sauvage barato\": Asad x Sauvage, 8h no braço", "objetivo": "Teste de fixação com prova visual. Responde a dúvida mais buscada sobre árabes.", "gancho": "\"Chamam o Asad de 'Sauvage barato'. Passei um em cada braço e esperei 8 horas.\"", "orientacoes": "Marque os braços com fita (E = Asad, D = Sauvage). Mostre o horário no celular a cada etapa (0h, 4h e 8h). Mantenha a mesma luz. Comece cedo num dia comum. Duração de 50 a 60s.", "roteiro": "Chamam o Asad de \"Sauvage barato\". Passei um em cada braço e esperei 8 horas.\n\nEsquerdo: Lattafa Asad. Direito: Dior Sauvage Parfum.\n\n0h: o Asad abre com pimenta e fica bem doce. O Sauvage Parfum é mais redondo, mais baunilha.\n\n4h: [O QUE VOCÊ SENTIU].\n\n8h: [QUAL AINDA ESTÁ VIVO].\n\nDetalhe que pouca gente fala: o Asad é comparado com o Sauvage Elixir, não com esse aqui. Se você comprar esperando o Sauvage que conhece, vai estranhar.\n\nVeredito: [CONCLUSÃO REAL]. Quer a parte 2 com outro árabe? Comenta \"parte 2\".", "legenda": "Asad x Sauvage Parfum: 8 horas de teste. Quem fixou mais?\n#lattafa #asad #sauvage #perfumearabe #perfumemasculino", "weekday": "Qua"}, {"date": "2026-11-27", "time": "19:30", "fmt": "Vídeo", "pilar": "Coleção Valota", "title": "SLOT FIXO: estreia do perfume novo", "objetivo": "Mostrar novidade e criar gancho para uma review na semana seguinte, o que traz o seguidor de volta.", "gancho": "\"Acabou de chegar. Primeira borrifada, ao vivo, sem ensaio.\"", "orientacoes": "⚠️ Confirme qual perfume é e se chega até 27/11. Se não chegar, troque com o vídeo 13 (07/12). Unboxing rápido (3s), close no frasco, borrifada e reação real. Duração de 30 a 40s.", "roteiro": "Acabou de chegar. Primeira borrifada, ao vivo, sem ensaio.\n\nEsse é o [PERFUME], da [MARCA]. [Comprei por / Ganhei de] [PREÇO ou ORIGEM].\n\n(borrifa) [PRIMEIRA REAÇÃO REAL]. Lembra [REFERÊNCIA, se lembrar].\n\nVou usar por uma semana e volto com a review completa: fixação, projeção e se vale o preço.\n\nSegue pra não perder.", "legenda": "Chegou! Primeira impressão do [PERFUME]. Review completa em 1 semana.\n#unboxing #perfumes #perfumaria #perfumenovo", "recomendacoes": "Se for publi ou recebido de marca, coloque #publi ou #recebido na legenda.", "weekday": "Sex"}, {"date": "2026-11-30", "time": "20:00", "fmt": "Carrossel", "pilar": "Perfume certo na hora certa", "title": "5 perfumes que não enjoam no calor", "objetivo": "Conteúdo sazonal com muitos salvamentos na entrada do verão.", "slides": [["5 perfumes que não enjoam no calor de dezembro", "Do meu acervo, testados no verão brasileiro."], ["Acqua di Giò Parfum", "O clássico do calor. Marinho, limpo, profissional. Vai do escritório ao almoço."], ["Polo 67 EDP", "Esportivo, mas chique. Fresco com fundo amadeirado, segura o dia."], ["Light Blue Capri in Love", "O mais leve da lista. Pós-banho, praia, academia. Reaplica à tarde."], ["YSL MYSLF", "Limpo e moderno, com flor de laranjeira. Ótimo pra sala com ar-condicionado."], ["L'Eau d'Issey Intense", "Cítrico com incenso no fundo. O diferente da lista."], ["Bônus", "No calor, borrife menos e mais vezes. Salva pra usar no verão."]], "legenda": "35 graus e perfume doce não combinam. Esses 5 combinam.\n#perfumedeverao #perfumemasculino #acquadigio #polo67", "recomendacoes": "Se der, fotografe os frascos com luz de sol forte, com cara de verão.", "weekday": "Seg"}, {"date": "2026-12-02", "time": "19:30", "fmt": "Vídeo", "pilar": "Na prova", "title": "Nicho x grife: Basso Sospiro vale perto do Bleu?", "objetivo": "Trazer o nicho para a conversa e posicionar a Valota nos três mundos: nicho, grife e árabe.", "gancho": "\"Esse aqui é perfume de nicho. Custa bem mais que um Bleu de Chanel. Vale a diferença?\"", "orientacoes": "Dois frascos lado a lado na mesa, fala direto pra câmera. ⚠️ Se mostrar preço, use o que você pagou (não invente). Duração de 40 a 50s.", "roteiro": "Esse aqui é perfume de nicho. Custa bem mais que um Bleu de Chanel. Vale a diferença?\n\nEsquerda: Basso, da Sospiro, meu único nicho. Direita: Bleu de Chanel Parfum, o melhor de grife que eu tenho.\n\nOnde o nicho ganha: fixação e personalidade. O Basso fica no corpo o dia inteiro e não lembra nada de shopping.\n\nOnde a grife ganha: versatilidade. O Bleu vai em qualquer lugar. O Basso pede ocasião, tipo noite fria ou jantar especial.\n\nEntão vale? Se você quer UM perfume pra tudo, não: fica no Bleu. Se já tem o básico e quer algo que ninguém tem, aí faz sentido.\n\nNicho é pra quem já tem a base. Concorda?", "legenda": "Nicho x grife: Basso (Sospiro) x Bleu de Chanel Parfum. Vale a diferença?\n#perfumedenicho #sospiro #bleudechanel #perfumemasculino", "weekday": "Qua"}, {"date": "2026-12-04", "time": "20:00", "fmt": "Carrossel", "pilar": "Perfume certo na hora certa", "title": "NATAL: presente pra ele que ninguém erra", const MONTHS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DOW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const keys=[...new Set(POSTS.map(p=>p.date.slice(0,7)))].sort();
let idx=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
 const [y,m]=keys[idx].split("-").map(Number);
 document.getElementById("month").textContent=MONTHS[m-1]+" "+y;
 const list=POSTS.filter(p=>p.date.startsWith(keys[idx]));
 document.getElementById("cnt").textContent=list.length;
 document.getElementById("prev").disabled=idx===0;
 document.getElementById("next").disabled=idx===keys.length-1;
 const g=document.getElementById("grid");g.innerHTML=DOW.map(d=>`<div class="dow">${d}</div>`).join("");
 const first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
 for(let i=0;i<first;i++)g.insertAdjacentHTML("beforeend",'<div class="day empty"></div>');
 for(let d=1;d<=days;d++){
  const ds=`${keys[idx]}-${String(d).padStart(2,"0")}`;
  const ps=list.filter(p=>p.date===ds);
  const cards=ps.map(p=>`<button class="post" data-i="${POSTS.indexOf(p)}"><span class="tag ${p.fmt}">${p.fmt}</span><span class="t">${p.time}</span><div class="h">${esc(p.title)}</div></button>`).join("");
  g.insertAdjacentHTML("beforeend",`<div class="day ${ps.length?"has":"nopost"}"><div class="n">${d}</div>${cards}</div>`);
 }
 g.querySelectorAll(".post").forEach(b=>b.onclick=()=>open(POSTS[b.dataset.i]));
}
const sec=(t,v)=>v?`<div class="sec"><h3>${t}</h3><p>${esc(v)}</p></div>`:"";
function open(p){
 const [y,m,d]=p.date.split("-");
 let body=sec("Objetivo",p.objetivo);
 if(p.fmt==="Vídeo"){
  body+=sec("Gancho (primeiros 3 segundos)",p.gancho)+sec("Orientações para gravação",p.orientacoes)+sec("Roteiro completo",p.roteiro)+sec("Legenda",p.legenda);
 }else{
  const sl=p.slides.map((s,i)=>`<div class="slide"><div class="sn">Slide ${i+1}${i===0?" · capa":i===p.slides.length-1?" · CTA":""}</div><div class="st">${esc(s[0])}</div><div class="sx">${esc(s[1])}</div></div>`).join("");
  body+=`<div class="sec"><h3>Slides</h3>${sl}</div>`+sec("Legenda",p.legenda);
 }
 body+=sec("Recomendações",p.recomendacoes);
 document.getElementById("md").innerHTML=`<button class="close" aria-label="Fechar">×</button><span class="tag ${p.fmt}">${p.fmt}</span><h2>${esc(p.title)}</h2><div class="meta">${p.weekday}, ${d}/${m}/${y} · ${p.time} · Pilar: ${esc(p.pilar)}</div>${body}`;
 document.querySelector(".close").onclick=close;
 document.getElementById("ov").classList.add("open");
}
function close(){document.getElementById("ov").classList.remove("open")}
document.getElementById("ov").onclick=e=>{if(e.target.id==="ov")close()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
document.getElementById("prev").onclick=()=>{if(idx>0){idx--;render()}};
document.getElementById("next").onclick=()=>{if(idx<keys.length-1){idx++;render()}};
render();
</script>
</body>
