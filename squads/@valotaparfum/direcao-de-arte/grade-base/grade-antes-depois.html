<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Grade Valota Parfum · antes e depois</title>
<style>
@font-face { font-family: "Gotham"; src: url("img/GothamBlack.otf"); font-weight: 900; }
@font-face { font-family: "Montserrat"; src: url("img/Montserrat.ttf"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1600px; background: #0A1F23; font-family: "Montserrat", sans-serif; color: #F2E8D8; padding: 60px; }
h1 { font-family: Gotham; font-size: 56px; text-transform: uppercase; }
h1 span { color: #FFC93C; }
.sub { font-weight: 300; font-size: 24px; margin-top: 10px; opacity: .85; }
.cols { display: flex; gap: 60px; margin-top: 44px; }
.col h2 { font-weight: 800; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 18px; color: #D49A4E; }
.grid { display: grid; grid-template-columns: repeat(3, 230px); gap: 3px; background: #fff; padding: 3px; }
.grid img { width: 230px; height: 307px; object-fit: cover; display: block; }
.legend { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 12px; }
.legend span { font-size: 18px; font-weight: 600; padding: 8px 16px; border-radius: 99px; }
</style>
</head>
<body>
  <h1>Feed <span>mesclado</span></h1>
  <p class="sub">Mesmas publicações, capas novas dos reels com a base Petróleo &amp; Âmbar em rodízio. Os carrosséis ficam como estão.</p>
  <div class="cols">
    <div class="col"><h2>Hoje</h2>
      <img src="../referencias/meu-feed-2026-11-11.png" style="width:696px;display:block">
    </div>
    <div class="col"><h2>Depois</h2>
      <div class="grid"><img src="carrosseis/c1-esfrega.png"><img src="capas-1080x1920/grade-3x4/grade-01-make.png"><img src="carrosseis/c2-ysl.png"><img src="capas-1080x1920/grade-3x4/grade-02-leve.png"><img src="capas-1080x1920/grade-3x4/grade-03-treino.png"><img src="carrosseis/c3-aventus.png"><img src="capas-1080x1920/grade-3x4/grade-04-baratos.png"><img src="capas-1080x1920/grade-3x4/grade-05-hypado.png"><img src="carrosseis/c4-5erros.png"><img src="capas-1080x1920/grade-3x4/grade-06-habito.png"><img src="capas-1080x1920/grade-3x4/grade-07-plantao.png"><img src="capas-1080x1920/grade-3x4/grade-08-arabes.png"></div>
      <div class="legend"><span style="background:#0F2E33;color:#F2E8D8;box-shadow:inset 0 0 0 2px rgba(242,232,216,.3)">Petróleo</span><span style="background:#F2E8D8;color:#0A1F23;box-shadow:inset 0 0 0 2px rgba(242,232,216,.3)">Creme</span><span style="background:#D49A4E;color:#0A1F23;box-shadow:inset 0 0 0 2px rgba(242,232,216,.3)">Âmbar</span><span style="background:#FFC93C;color:#0A1F23;box-shadow:inset 0 0 0 2px rgba(242,232,216,.3)">Amarelo Laudo</span><span style="background:#9C452A;color:#F2E8D8;box-shadow:inset 0 0 0 2px rgba(242,232,216,.3)">Pimenta</span><span style="background:#0A1F23;color:#F2E8D8;box-shadow:inset 0 0 0 2px rgba(242,232,216,.3)">Foto</span></div>
    </div>
  </div>
</body>
</html>
