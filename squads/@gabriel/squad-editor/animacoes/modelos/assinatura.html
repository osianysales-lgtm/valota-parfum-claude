<!DOCTYPE html>
<!--
  ASSINATURA DE MARCA — encerramento com a logo sozinha no fundo principal, com luzes (modelo reutilizável)

  Regra da squad: a logo NÃO fica fixa no topo durante o vídeo. Ela assina o final, sozinha.
  Use como última camada/cena (3 a 4 s), depois do CTA.

  Caminho 1:  node daphne.js animacoes/modelos/assinatura.html 4 --ficha output/vN/ficha.json --out output/vN/assinatura.mp4
              (ou copie a função para dentro do HTML do vídeo)
  Caminho 2/3: camada "cheia" no fim do vídeo, com "legenda": false
     { "arquivo": "../../animacoes/modelos/assinatura.html", "inicio": 26.0, "fim": 30.0, "layout": "cheia", "legenda": false }

  params (--params ou "params" na camada), todos opcionais:
    logo      caminho da logo (padrão: FICHA.logos.assinatura → principal → horizontal)
    cor       cor das luzes (padrão: cor de destaque da ficha)
    fundo     cor de fundo (padrão: cor de fundo da ficha)
    largura   largura da logo em px (padrão 820)
    luzes     "completas" (brilho + raios + partículas + risco de luz) | "suaves" (só brilho e reflexo)
    duracao   segundos (o Salsicha preenche sozinho)
-->
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  #a{position:absolute;inset:0}
</style></head><body><div id="a"></div>
<script>
(function () {
  const F = window.FICHA || {}, P = window.PARAMS || {}, cs = getComputedStyle(document.documentElement);
  const url = p => !p ? '' : /^(https?|data|file):/i.test(p) ? p : (p.startsWith('/') ? 'file://' : 'file:///') + p.replace(/\\/g, '/');
  const logo = url(P.logo || (F.logos && (F.logos.assinatura || F.logos.principal || F.logos.horizontal || F.logos.claro)));
  const cor = P.cor || cs.getPropertyValue('--cor-destaque').trim() || (F.cores && F.cores.destaque) || '#E8C97A';
  const fundo = P.fundo || cs.getPropertyValue('--cor-fundo').trim() || (F.cores && F.cores.fundo) || '#050505';
  const W = P.largura || 820, D = P.duracao || 4, completas = (P.luzes || 'completas') === 'completas';
  const h = cor.replace('#', ''), n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  const rgb = [n >> 16 & 255, n >> 8 & 255, n & 255], rgba = a => `rgba(${rgb.join(',')},${a})`;
  const claro = `rgba(${rgb.map(v => Math.round(v + (255 - v) * 0.7)).join(',')},`;
  const E = x => Math.max(0, Math.min(1, x)), eo5 = x => 1 - Math.pow(1 - E(x), 5);
  const eio = x => { x = E(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const lerp = (a, b, x) => a + (b - a) * x;
  const PO = Array.from({ length: 46 }, (_, i) => ({ x: (i * 197) % 1080, y: 500 + ((i * 331) % 900), r: 2 + (i % 4), v: 8 + (i % 7) * 4, f: i * 1.7 }));
  const el = document.getElementById('a'), Y = 960;
  window.render = function (lt) {
    const ent = eo5(lt / 1.1), bri = E((lt - 0.2) / 0.9), fl = E((lt - 0.55) / 0.9), varre = E((lt - 1.2) / 1.0);
    const raios = `conic-gradient(from ${lt * 12}deg at 50% 50%, ${Array.from({ length: 12 }, (_, i) => `${rgba(i % 2 ? 0 : 0.07)} ${i * 30}deg ${i * 30 + 30}deg`).join(',')})`;
    el.innerHTML = `<div style="position:absolute;inset:0;background:${fundo}"></div>
      ${completas ? `<div style="position:absolute;left:50%;top:${Y}px;width:1500px;height:1500px;transform:translate(-50%,-50%) scale(${0.6 + 0.4 * bri});border-radius:50%;background:${raios};-webkit-mask-image:radial-gradient(circle,#000 0%,transparent 62%);opacity:${bri}"></div>` : ''}
      <div style="position:absolute;left:50%;top:${Y}px;width:1100px;height:700px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side, ${rgba(0.34 * bri)}, ${rgba(0.12 * bri)} 45%, transparent 100%)"></div>
      ${completas ? PO.map(p => `<div style="position:absolute;left:${p.x + Math.sin(lt + p.f) * 10}px;top:${p.y - lt * p.v}px;width:${p.r * 2}px;height:${p.r * 2}px;border-radius:50%;background:${claro}1);opacity:${((0.25 + 0.5 * Math.abs(Math.sin(lt * 1.3 + p.f))) * bri).toFixed(2)};filter:blur(${p.r > 3 ? 2 : 0}px)"></div>`).join('') : ''}
      <div style="position:absolute;left:50%;top:${Y}px;width:${W}px;transform:translate(-50%,-50%) scale(${lerp(0.9, 1, ent) * (1 + 0.035 * lt / D)});opacity:${ent};filter:blur(${(1 - ent) * 12}px) drop-shadow(0 0 ${40 * bri}px ${rgba(0.45)})">
        <img src="${logo}" style="width:100%;display:block">
        <div style="position:absolute;inset:0;-webkit-mask-image:url('${logo}');-webkit-mask-size:100% 100%;mix-blend-mode:screen;
          background:linear-gradient(105deg, transparent ${lerp(-30, 110, varre) - 12}%, ${claro}.95) ${lerp(-30, 110, varre)}%, transparent ${lerp(-30, 110, varre) + 12}%)"></div>
      </div>
      ${completas ? `<div style="position:absolute;left:${lerp(-700, 1500, eio(fl))}px;top:${Y - 6}px;width:620px;height:12px;border-radius:12px;background:linear-gradient(90deg,transparent,${claro}.95),transparent);filter:blur(2px);opacity:${fl > 0 && fl < 1 ? 1 : 0};box-shadow:0 0 40px 10px ${rgba(0.55)}"></div>
      <div style="position:absolute;left:50%;top:${Y}px;width:${120 + 260 * Math.sin(Math.PI * fl)}px;height:${120 + 260 * Math.sin(Math.PI * fl)}px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side, ${claro}${0.5 * Math.sin(Math.PI * fl)}), transparent);mix-blend-mode:screen"></div>` : ''}
      <div style="position:absolute;inset:0;background:#000;opacity:${E((lt - (D - 0.35)) / 0.35) * 0.6}"></div>`;
  };
  window.render(0);
})();
</script></body></html>
