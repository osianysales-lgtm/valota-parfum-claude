<!DOCTYPE html>
<!--
  ELEMENTO DE REFORÇO — modelo reutilizável (camada "sobreposta", fundo transparente)
  Reforça na tela o que a pessoa está falando: um número, uma ferramenta, um resultado, uma palavra.

  Uso em camadas.json (tempos do vídeo editado):
    { "arquivo": "../../animacoes/modelos/reforco.html", "inicio": 12.4, "fim": 14.6, "layout": "sobreposta",
      "params": { "tipo": "numero", "valor": 70, "sufixo": "%", "rotulo": "menos tempo de edição", "posicao": "topo" } }

  params:
    tipo     numero | selo | logo | texto | lista
    valor    (numero) número final da contagem         prefixo / sufixo: "R$ ", "%", "x", "h"
    texto    (selo/texto) texto principal — use AS PALAVRAS DA FALA, não invente
    rotulo   linha pequena de apoio (opcional)
    imagem   (logo) caminho do arquivo .png/.svg        itens: (lista) ["Gravar", "Roteiro", "Narrar"]
    posicao  topo (padrão, y≈330) | alto (y≈560) | centro (y≈900)  — nunca na faixa da legenda (1150–1420)
    lado     centro (padrão) | esquerda | direita
  Cores e fontes vêm da ficha (--cor-destaque, --fonte-titulo...). A Dafne injeta window.PARAMS e window.FICHA.
-->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
  #r{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px;transform-origin:50% 50%}
  #r.esquerda{align-items:flex-start;padding-left:70px} #r.direita{align-items:flex-end;padding-right:70px}
  .num{font-family:var(--fonte-titulo,'Arial Black',sans-serif);font-size:190px;line-height:.9;color:var(--cor-destaque,#5ff);
       text-shadow:0 8px 30px rgba(0,0,0,.55),0 0 2px #000}
  .selo{font-family:var(--fonte-titulo,'Arial Black',sans-serif);font-size:84px;line-height:1;padding:18px 34px;border-radius:22px;
        background:var(--cor-destaque,#5ff);color:var(--cor-fundo,#000);box-shadow:0 14px 40px rgba(0,0,0,.45);white-space:nowrap}
  .txt{font-family:var(--fonte-titulo,'Arial Black',sans-serif);font-size:96px;line-height:1;color:#fff;text-shadow:0 0 2px #000,0 8px 28px rgba(0,0,0,.6)}
  .rot{font-family:var(--fonte-texto,Arial,sans-serif);font-weight:700;font-size:44px;color:#fff;padding:10px 22px;border-radius:14px;
       background:rgba(0,0,0,.55);text-align:center;max-width:900px}
  .logo{width:300px;height:300px;border-radius:44px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .logo img{max-width:78%;max-height:78%}
  .item{display:flex;align-items:center;gap:18px;font-family:var(--fonte-texto,Arial,sans-serif);font-weight:800;font-size:52px;color:#fff;
        background:rgba(0,0,0,.6);padding:14px 28px;border-radius:18px;min-width:520px}
  .item .ck{width:46px;height:46px;border-radius:50%;background:var(--cor-destaque,#5ff);color:var(--cor-fundo,#000);display:flex;align-items:center;justify-content:center;font-size:32px}
</style></head><body><div id="r"></div>
<script>
  var P = Object.assign({ tipo: 'selo', texto: '', posicao: 'topo', lado: 'centro', duracao: 2.5 }, window.PARAMS || {});
  var Y = { topo: 330, alto: 560, centro: 900 }[P.posicao] || 330;
  var r = document.getElementById('r');
  r.className = P.lado || '';
  r.style.top = Y + 'px';
  var E = function (x) { return Math.max(0, Math.min(1, x)); };
  var easeOut = function (x) { x = E(x); return 1 - Math.pow(1 - x, 3); };
  var back = function (x) { x = E(x); var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  var fmt = function (v) { return Math.round(v).toLocaleString('pt-BR'); };

  // monta o conteúdo uma vez
  var html = '';
  if (P.tipo === 'numero') html = '<div class="num" id="n">' + (P.prefixo || '') + '0' + (P.sufixo || '') + '</div>';
  else if (P.tipo === 'logo') html = '<div class="logo"><img src="' + (P.imagem || '') + '"></div>';
  else if (P.tipo === 'texto') html = '<div class="txt">' + P.texto + '</div>';
  else if (P.tipo === 'lista') html = (P.itens || []).map(function (t, i) { return '<div class="item" id="i' + i + '"><span class="ck">✓</span>' + t + '</div>'; }).join('');
  else html = '<div class="selo">' + P.texto + '</div>';
  if (P.rotulo && P.tipo !== 'lista') html += '<div class="rot">' + P.rotulo + '</div>';
  r.innerHTML = html;

  window.render = function (t) {
    var saida = E((t - (P.duracao - 0.25)) / 0.25);           // some nos últimos 0,25 s
    var ent = back(t / 0.38);
    r.style.opacity = (E(t / 0.12) * (1 - saida)).toFixed(3);
    r.style.transform = 'translateY(' + (-50 + 40 * (1 - easeOut(t / 0.35))) + '%) scale(' + (0.7 + 0.3 * ent) * (1 - 0.08 * saida) + ')';
    if (P.tipo === 'numero') {
      var v = (P.valor || 0) * easeOut((t - 0.1) / Math.min(1.1, P.duracao * 0.5));
      document.getElementById('n').textContent = (P.prefixo || '') + fmt(v) + (P.sufixo || '');
    }
    if (P.tipo === 'lista') (P.itens || []).forEach(function (_, i) {
      var el = document.getElementById('i' + i), k = easeOut((t - 0.15 - i * 0.12) / 0.3);
      el.style.opacity = k; el.style.transform = 'translateX(' + (-60 * (1 - k)) + 'px)';
    });
    // respiração sutil enquanto fica na tela (não parecer travado)
    var vivo = 1 + 0.015 * Math.sin(t * 3);
    r.firstChild && (r.firstChild.style.transform = 'scale(' + vivo + ')');
  };
  window.render(0);
</script></body></html>
