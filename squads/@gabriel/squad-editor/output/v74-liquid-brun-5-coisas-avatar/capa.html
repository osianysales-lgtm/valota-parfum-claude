<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url(fonts/Montserrat-VF.ttf)}
@font-face{font-family:GB;src:url(fonts/GothamBlack.otf)}
:root{--pet:#0F2E33;--noite:#0A1F23;--luz:#1A4A52;--amb:#D49A4E;--ama:#FFC93C;--cre:#F2E8D8;--stop:#E0453A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--pet)}
#bgPet{position:absolute;inset:0;background:radial-gradient(ellipse 900px 1100px at 50% 42%,var(--luz) 0%,var(--pet) 55%,var(--noite) 100%)}
#bgFoto{position:absolute;left:-156px;top:-60px;width:1393px;filter:blur(18px) brightness(.62) saturate(1.1);transform:scale(1.06)}
#vinheta{position:absolute;inset:0;background:radial-gradient(ellipse 620px 760px at 50% 760px,rgba(0,0,0,0) 0%,rgba(10,10,10,.25) 60%,rgba(8,6,6,.75) 100%)}
#glow{position:absolute;left:540px;top:870px;width:760px;height:760px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(212,154,78,.55) 0%,rgba(212,154,78,.18) 40%,rgba(212,154,78,0) 70%)}
.nota{position:absolute;filter:drop-shadow(0 14px 16px rgba(0,0,0,.55))}
#frasco{position:absolute;left:540px;top:640px;height:462px;transform:translateX(-50%);filter:drop-shadow(0 26px 30px rgba(0,0,0,.65))}
.stop{position:absolute;top:770px;width:200px;height:200px;margin-left:-100px;border-radius:50%;border:20px solid var(--stop);
  box-shadow:0 0 30px 8px rgba(224,69,58,.8),inset 0 0 26px 6px rgba(224,69,58,.65);background:rgba(224,69,58,.06)}
.stop:after{content:'';position:absolute;left:50%;top:50%;width:100%;height:20px;background:var(--stop);transform:translate(-50%,-50%) rotate(-45deg);box-shadow:0 0 22px 5px rgba(224,69,58,.8)}
#tit{position:absolute;left:0;right:0;top:305px;text-align:center}
#tit .l1{font-family:GB;font-size:128px;line-height:1;color:#fff;letter-spacing:1px;text-shadow:0 8px 24px rgba(0,0,0,.6)}
#tit .l2{font-family:M;font-weight:900;font-size:104px;line-height:1.02;margin-top:6px;letter-spacing:1px;
  background:linear-gradient(180deg,#FFE7A6 0%,#FFC93C 38%,#D49A4E 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
#tit .pill{display:inline-block;margin-top:18px;background:var(--ama);color:var(--noite);font-family:M;font-weight:800;font-size:38px;letter-spacing:1px;padding:12px 30px;border-radius:60px;box-shadow:0 10px 22px rgba(0,0,0,.45)}
#leg{position:absolute;left:0;right:0;top:1118px;text-align:center}
#leg span{display:inline-block;font-family:GB;font-size:60px;color:var(--cre);background:rgba(10,31,35,.88);padding:6px 22px;border-radius:16px}
#leg span b{color:var(--noite);background:var(--amb);padding:0 12px;border-radius:10px;font-weight:normal}
#av{position:absolute;left:290px;top:1225px;width:500px;height:640px;border-radius:30px;overflow:hidden;border:6px solid var(--cre);box-shadow:0 0 0 4px var(--noite),0 16px 34px rgba(0,0,0,.5);background:#000}
#av img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
#av i{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-family:M;font-weight:800;font-size:30px;font-style:normal;color:#fff;text-shadow:0 2px 8px #000}
.guia{position:absolute;left:0;right:0;height:0;border-top:4px dashed #ff00ff;display:none}
body.g .guia{display:block}
</style></head><body>
<div id="bgPet"></div>
<img id="bgFoto" src="ref/capa_foto.png">
<div id="vinheta"></div>
<div id="notas"></div>
<div id="glow"></div>
<div class="stop" style="left:205px"></div><div class="stop" style="left:875px"></div>
<img id="frasco" src="capa/frasco_ok.png">
<div id="tit"><div class="l1">NÃO COMPRE</div><div class="l2">O LIQUID BRUN</div><div class="pill">ANTES DE SABER ESSAS 5 COISAS</div></div>
<div id="leg"><span>GENTE, NÃO COMPRA</span></div>
<div id="av"><img src="tmp/avatar_placeholder.png"><i>(seu avatar entra aqui)</i></div>
<div class="guia" style="top:240px"></div><div class="guia" style="top:1680px"></div>
<script>
const q=new URLSearchParams(location.search),v=q.get('v')||'A';
if(q.get('g'))document.body.classList.add('g');
if(v==='A'){document.querySelector('#bgPet').style.display='none'}
else{document.querySelector('#bgFoto').style.display='none';document.querySelector('#vinheta').style.background='radial-gradient(ellipse 620px 760px at 50% 760px,rgba(0,0,0,0) 0%,rgba(10,31,35,.2) 60%,rgba(10,31,35,.6) 100%)'}
// notas em volta do frasco (simétricas, fora da chamada e dos sinais)
const N=[['baunilha',20,620,250,-14],['castanha',860,630,150,10],['canela',20,975,240,14],['flor',830,915,210,-6],['cardamomo',300,1010,130,8],['pralina',665,975,125,-4]];
const box=document.querySelector('#notas');
N.forEach(([k,x,y,w,r])=>{const i=new Image();i.className='nota';i.src='notas/cut/'+k+'.png';Object.assign(i.style,{left:x+'px',top:y+'px',width:w+'px',transform:`rotate(${r}deg)`});box.appendChild(i)});
</script></body></html>
