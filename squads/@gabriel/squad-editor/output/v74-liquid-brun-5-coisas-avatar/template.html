<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url(fonts/Montserrat-VF.ttf)}
@font-face{font-family:GB;src:url(fonts/GothamBlack.otf)}
:root{--pet:#0F2E33;--noite:#0A1F23;--luz:#1A4A52;--amb:#D49A4E;--ama:#FFC93C;--cre:#F2E8D8;--ced:#6B4430;--pim:#9C452A;--men:#7DBFB3;--stop:#E0453A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--pet)}
.abs{position:absolute}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 900px 1100px at 50% 40%,var(--luz) 0%,var(--pet) 55%,var(--noite) 100%)}
#dots{position:absolute;inset:0;opacity:.07;background-image:radial-gradient(var(--cre) 1.6px,transparent 1.8px);background-size:34px 34px}
#fumaca img,#capaFum img{position:absolute;mix-blend-mode:screen}
#notas{position:absolute;inset:0}

#vel{position:absolute;inset:0;background:radial-gradient(ellipse 480px 600px at 50% 930px,rgba(15,46,51,.9) 0%,rgba(15,46,51,.55) 62%,rgba(15,46,51,0) 100%)}
/* capa (A) */
#capa{position:absolute;inset:0;overflow:hidden;background:#120c0a}
#capa .bgf{position:absolute;left:-156px;top:-60px;width:1393px;filter:blur(18px) brightness(.62) saturate(1.1);transform:scale(1.06)}
#capa .vin{position:absolute;inset:0;background:radial-gradient(ellipse 620px 760px at 50% 760px,rgba(0,0,0,0) 0%,rgba(10,10,10,.25) 60%,rgba(8,6,6,.75) 100%)}
#capa .glow{position:absolute;left:540px;top:960px;width:760px;height:760px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(212,154,78,.55) 0%,rgba(212,154,78,.18) 40%,rgba(212,154,78,0) 70%)}
#capa .nota{position:absolute;filter:drop-shadow(0 14px 16px rgba(0,0,0,.55))}
#capa .fr{position:absolute;left:540px;top:660px;height:600px;transform:translateX(-50%);filter:drop-shadow(0 26px 30px rgba(0,0,0,.65))}
.stop{position:absolute;width:200px;height:200px;border-radius:50%;border:20px solid var(--stop);box-shadow:0 0 30px 8px rgba(224,69,58,.8),inset 0 0 26px 6px rgba(224,69,58,.65);background:rgba(224,69,58,.06)}
.stop:after{content:'';position:absolute;left:50%;top:50%;width:100%;height:20px;background:var(--stop);transform:translate(-50%,-50%) rotate(-45deg);box-shadow:0 0 22px 5px rgba(224,69,58,.8)}
#capa .tit{position:absolute;left:0;right:0;top:305px;text-align:center}
.l1{font-family:GB;font-size:128px;line-height:1;color:#fff;letter-spacing:1px;text-shadow:0 8px 24px rgba(0,0,0,.6)}
.ouro{font-family:M;font-weight:900;background:linear-gradient(180deg,#FFE7A6 0%,#FFC93C 38%,#D49A4E 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
.l2{font-size:104px;line-height:1.02;margin-top:6px;letter-spacing:1px}
.pillA{display:inline-block;background:var(--ama);color:var(--noite);font-family:M;font-weight:800;font-size:38px;letter-spacing:1px;padding:12px 30px;border-radius:60px;box-shadow:0 10px 22px rgba(0,0,0,.45)}

#head{position:absolute;left:0;right:0;top:268px;text-align:center;opacity:0}
#head .bol{display:flex;gap:16px;justify-content:center;margin-bottom:14px}

.cena{position:absolute;inset:0;opacity:0}
.e{position:absolute;width:0;height:0;opacity:0}
.in{position:absolute;left:0;top:0;width:max-content;transform:translate(-50%,-50%)}

.fr{filter:drop-shadow(0 24px 26px rgba(0,0,0,.6))}

.stamp.red{color:#E0453A;border-color:#E0453A} .stamp.ama{color:var(--ama);border-color:var(--ama)}
.big{width:420px;height:470px;border-radius:34px;border:5px solid var(--cre);text-align:center;padding-top:26px;box-shadow:0 18px 34px rgba(0,0,0,.5)}

.tab{width:900px}

.tab .row b{flex:1;white-space:nowrap;font-family:M;font-weight:800;font-size:38px;color:var(--cre);padding-left:20px}
.tab .row i{width:170px;text-align:center;font-style:normal;font-family:GB;font-size:56px;color:var(--men);opacity:0}
.pola{width:700px;background:#fff;padding:30px 30px 26px;border-radius:10px;box-shadow:0 20px 40px rgba(0,0,0,.55)}
.pola .fot{height:440px;background:radial-gradient(ellipse at 50% 60%,#F2E8D8 0%,#d9c8ad 100%);position:relative;overflow:hidden}
.pola .fot img{position:absolute;bottom:22px;filter:drop-shadow(0 14px 14px rgba(0,0,0,.35))}
.pola p{font-family:M;font-weight:800;font-size:44px;color:var(--noite);text-align:center;margin-top:20px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.grupo{width:600px;border-radius:26px;overflow:hidden;border:6px solid var(--cre);box-shadow:0 18px 36px rgba(0,0,0,.55)}
.grupo img{width:100%;display:block}
/* legenda (caixinha desde o 1º quadro) */
#leg{position:absolute;left:0;right:0;top:1335px;text-align:center}

#leg .bx b{color:var(--noite);background:var(--amb);padding:0 12px;border-radius:10px;font-weight:normal}
/* avatar AV1 */
#av{position:absolute;left:290px;top:1225px;width:500px;height:640px;border-radius:30px;overflow:hidden;border:6px solid var(--cre);box-shadow:0 0 0 4px var(--noite),0 16px 34px rgba(0,0,0,.5);background:#000}
#av video,#av img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
#av i{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-family:M;font-weight:800;font-size:30px;font-style:normal;color:#fff;text-shadow:0 2px 8px #000}
#ass{position:absolute;left:0;right:0;top:1460px;text-align:center;opacity:0}
#ass b{display:block;font-family:GB;font-size:92px;color:var(--cre);letter-spacing:10px}
#ass i{display:block;font-style:normal;font-family:M;font-weight:800;font-size:44px;color:var(--amb);margin-top:12px;letter-spacing:3px}

E('s5b',T.link,540,1048,`<div class="chip" style="background:var(--ama);color:var(--noite);font-size:42px">👉 LINK NA BIO</div>`);
// ===== CTA =====
E('cta',T.salva,540,420,`<div style="font-family:GB;font-size:112px;color:var(--cre);text-shadow:0 8px 20px rgba(0,0,0,.5)">SALVA 🔖</div>`);
E('cta',S0('cta')+0.05,540,760,IMG('capa/frasco_ok.png',440),'up');
E('cta',T.segue,540,1048,`<div class="chip" style="background:var(--ama);color:var(--noite);font-size:42px">SEGUE A VALOTA PARFUM</div>`);
// ---------- cabeçalho ----------
const bol=$('#head .bol');for(let k=1;k<=5;k++){const i=document.createElement('i');bol.appendChild(i)}
// ---------- avatar ----------
$('#av').innerHTML=D.AV?`<video src="${D.AV}" muted playsinline preload="auto"></video>`:`<img src="tmp/avatar_placeholder.png"><i>(seu avatar entra aqui)</i>`;
const leg=$('#leg');let legAt=-2,headAt=-1;
window.render=function(t){
  // capa: fixa desde o 1º quadro, sai junto com a fala "o cheiro"
  const cf=D.CENA.capa[1];$('#capa').style.opacity=t<cf?1:cl(1-(t-cf)/0.3);
  document.querySelectorAll('#capa .stop').forEach((s,k)=>s.style.opacity=(0.86+0.14*Math.sin(t*7+k*1.7)).toFixed(3));
  // notas do fundo: flutuam o vídeo inteiro; mais apagadas no CTA
  const ctaOn=t>=D.CENA.cta[0];const op=ctaOn?0.22:0.5;
  NF.forEach(({i,r,j})=>{i.style.opacity=op;i.style.transform=`translate(${(Math.sin(t*0.5+j)*14).toFixed(1)}px,${(Math.cos(t*0.42+j*1.3)*18).toFixed(1)}px) rotate(${(r+Math.sin(t*0.35+j)*5).toFixed(2)}deg)`});
  document.querySelectorAll('#fumaca img,#capaFum img').forEach((f,k)=>{f.style.opacity=(+f.dataset.o*(0.85+0.15*Math.sin(t*0.6+k))).toFixed(3);f.style.transform=`translate(${(Math.sin(t*0.18+k*2)*70).toFixed(1)}px,${(-t*7+k*30).toFixed(1)}px) scale(${(1.1+0.06*Math.sin(t*0.3+k)).toFixed(3)})`});
  // cenas
  for(const id in D.CENA){const [a,b]=D.CENA[id];const c=CEN[id];if(!c)continue;if(t<a||t>=b){c.style.opacity=0;continue}
    const pin=cl((t-a)/0.25),pout=id==='cta'?0:cl((t-(b-0.16))/0.16);c.style.opacity=(eo(pin)*(1-pout)).toFixed(3)}
  // elementos
  for(const o of EL){const [a,b]=D.CENA[o.cena];if(t<o.t||t>=b||(o.ate&&t>=o.ate)){o.e.style.opacity=0;continue}
    const p=cl((t-o.t)/(o.anim==='stamp'?0.2:0.32));let tr='translate(-50%,-50%)';
    if(o.anim==='pop')tr+=` scale(${(0.4+0.6*eob(p)).toFixed(3)})`;else if(o.anim==='up')tr+=` translateY(${(40*(1-eo(p))).toFixed(1)}px)`;
    else if(o.anim==='stamp')tr+=` scale(${(2.1-1.1*eo(p)).toFixed(3)})`;
    o.n.style.transform=tr;o.e.style.opacity=(o.anim==='stamp'?cl(p*1.6):eo(p)).toFixed(3)}
  // vida nas ilustrações
  document.querySelectorAll('.raios').forEach(g=>g.setAttribute('transform',`rotate(${(t*25)%360})`));
  document.querySelectorAll('.est path').forEach((s,k)=>s.style.opacity=(0.55+0.45*Math.abs(Math.sin(t*2.2+k))).toFixed(2));
  cDia.n.querySelector('.big').style.filter=t>=T.pesa&&t<D.CENA.s2[1]?'saturate(.6) brightness(.8)':'none';
  cNoi.n.querySelector('.big').style.boxShadow=t>=T.brilha?`0 0 ${(40+20*Math.sin(t*6)).toFixed(0)}px 10px rgba(255,201,60,.55)`:'0 18px 34px rgba(0,0,0,.5)';
  const s3=D.CENA.s3;const pr=cl((t-s3[0])/(s3[1]-s3[0]));
  rel.n.querySelector('.mm').setAttribute('transform',`rotate(${(pr*360*6).toFixed(1)})`);rel.n.querySelector('.hh').setAttribute('transform',`rotate(${(pr*300).toFixed(1)})`);
  const bf=cl((t-T.dura)/(T.pele+0.4-T.dura));document.querySelectorAll('.bar').forEach(b=>b.style.width=(92*eo(bf)).toFixed(1)+'%');
  aneis.n.querySelectorAll('i').forEach((r,k)=>{const q=((t-T.chega)*0.9+k/3)%1;r.style.transform=`translate(-50%,-50%) scale(${(1+q*1.4).toFixed(3)})`;r.style.opacity=t>=T.chega?(1-q).toFixed(2):0});
  // tabela: ✓ ticam um por um
  document.querySelectorAll('#s4b .row').forEach((r,k)=>r.querySelectorAll('i').forEach((c,m)=>{const tk=T.lista+0.1+k*0.22+m*0.08;const p=cl((t-tk)/0.18);c.style.opacity=p;c.style.transform=`scale(${(0.5+0.5*eob(p)).toFixed(2)})`}));
  // flash da foto de família
  $('#flash').style.opacity=t>=T.foto&&t<T.foto+0.35?(0.85*(1-(t-T.foto)/0.35)).toFixed(2):0;
  // cabeçalho 1–5
  let hi=-1;for(let k=0;k<D.HEAD.length;k++){if(t>=D.HEAD[k][0]&&t<D.HEAD[k][1]){hi=k;break}}
  const hd=$('#head');if(hi<0){hd.style.opacity=0}else{const [a,b,num,tit]=D.HEAD[hi];
    if(hi!==headAt){headAt=hi;const ht=hd.querySelector('.ht');ht.innerHTML=`<span>${num}.</span>${tit}`;let fs=82;ht.style.fontSize=fs+'px';while(ht.scrollWidth>930&&fs>50){fs-=2;ht.style.fontSize=fs+'px'}bol.querySelectorAll('i').forEach((i,k)=>i.className=k<num-1?'ok':(k===num-1?'on':''))}
    const p=cl((t-a)/0.25),q=cl((t-(b-0.14))/0.14);hd.style.opacity=(eo(p)*(1-q)).toFixed(3);hd.style.transform=`translateY(${(-20*(1-eo(p))).toFixed(1)}px)`}
  // legenda (caixinha)
  let gi=-1;for(let i=0;i<D.LEG.length;i++){if(t>=D.LEG[i].t0&&t<D.LEG[i].t1){gi=i;break}}
  if(gi!==legAt){legAt=gi;leg.innerHTML=gi<0?'':`<span class="bx">${D.LEG[gi].p.map(w=>w.h?`<b>${w.w}</b>`:w.w).join(' ')}</span>`}
  leg.style.opacity=gi<0?0:1;
  // avatar sai no fim da fala → assinatura
  const fo=cl((t-D.FALA_FIM-0.15)/0.45);$('#av').style.opacity=1-fo;$('#ass').style.opacity=cl((t-D.FALA_FIM-0.4)/0.4);
};
