 E(`<div class="mini"><img src="frascos/cards/${img}.jpg" style="width:${w}px;height:${h}px"></div>`,pos(cx-(w+20)/2,660),K.f_cards+i*0.08,D.END+1,'pop')});
E('<span class="tag ama" style="font-family:GB;font-size:46px;padding:20px 44px 14px">📌 SALVA PRA NÃO ESQUECER</span>',centro(1000),K.f_salva,D.END+1,'pop');
E('<span class="tag cre" style="font-size:38px">SEGUE A @VALOTAPARFUM 💛</span>',centro(1130),K.f_segue,D.END+1,'pop');

// ---------- render
const SC=[['capa',0,S.p1],...PF.map(p=>[p.k,p.t0,p.t1]),['fim',S.fim,D.END+1]];
const FMC={capa:'#D49A4E',cta:'#9C452A',fim:'#D49A4E'};PF.forEach(p=>FMC[p.k]=p.fm);
const leg=$('#leg');let legAtual=-1;
const TROCAS=[S.p1,...PF.slice(1).map(p=>p.t0),S.fim];
window.render=function(t){
 for(const o of L){
  const vis=t>=o.t0&&t<o.t1;const pin=cl((t-o.t0)/0.38),pout=cl((t-(o.t1-0.2))/0.2);
  if(!vis){o.d.style.opacity=0;o.d.style.display='none';continue}
  o.d.style.display='block';
  let op=1,tr='';
  switch(o.fx){
   case 'pop':op=cl(pin*2.2);tr=`scale(${(0.6+0.4*back(pin)).toFixed(4)})`;break;
   case 'up':op=eo(pin);tr=`translateY(${(34*(1-eo(pin))).toFixed(1)}px)`;break;
   case 'fade':op=eo(pin);break;
   case 'stamp':{const p=cl((t-o.t0)/0.26);op=cl(p*3);tr=`scale(${(1.6-0.6*eo(p)).toFixed(4)})`;break}
  }
  if(o.mv){const q=eo(cl((t-o.mv[0])/0.5));tr=`translateX(${(o.mv[1]*(1-q)).toFixed(1)}px) `+tr}
  op*=1-pout;
  if(o.rot!=null)tr+=` rotate(${o.rot}deg)`;
  if(o.pulse)tr+=` scale(${(1+0.04*Math.sin(t*2.4)).toFixed(4)})`;
  o.d.style.opacity=op.toFixed(3);o.d.style.transform=tr;
 }
 const cf=cl((t-S.p1+0.25)/0.5);$('#capa').style.opacity=(1-cf).toFixed(3);$('#capa').style.display=cf>=1?'none':'block';
 document.querySelectorAll('#cq .q5').forEach((s,i)=>{let fl=1;if(s.dataset.rt){const p=cl((t-s.dataset.rt)/0.35);fl=Math.abs(Math.cos(Math.PI*p));const on=p>=0.5;s.querySelector('.qm').style.opacity=on?0:1;s.querySelector('.qi').style.opacity=on?1:0}
  s.style.transform=`translateY(${(6*Math.sin(t*2+i)).toFixed(1)}px) rotate(${(i%2?3:-3)}deg) scaleX(${fl.toFixed(3)})`});
 if(D.CAPA.fav){const p=cl((t-D.CAPA.fav[1])/0.38);$('#cfav').style.opacity=cl(p*2.2);$('#cfav').style.transform=`scale(${(0.6+0.4*back(p)).toFixed(4)})`}
 const sc=SC.find(s=>t>=s[1]&&t<s[2])||SC[0];
 $('#fm2').style.background=FMC[sc[0]];
 $('#fm1').style.transform=`translate(${(60*Math.sin(t*0.11)).toFixed(1)}px,${(-30*t/60).toFixed(1)}px) rotate(${(3*Math.sin(t*0.07)).toFixed(2)}deg)`;
 $('#fm2').style.transform=`translate(${(-80*Math.sin(t*0.09+1)).toFixed(1)}px,${(-50*t/60).toFixed(1)}px)`;
 $('#fm3').style.transform=`translate(${(70*Math.sin(t*0.13+2)).toFixed(1)}px,${(-40*t/60).toFixed(1)}px)`;
 bgNotas.forEach(({im,t0,t1,ph})=>{const a=cl((t-t0)/0.6)*(1-cl((t-t1+0.3)/0.3));im.style.opacity=((D.TEMA==='creme'?0.5:0.58)*a).toFixed(3);
  im.style.transform=`translate(${(14*Math.sin(t*0.55+ph)).toFixed(1)}px,${(18*Math.sin(t*0.42+ph*1.7)).toFixed(1)}px) rotate(${(6*Math.sin(t*0.3+ph)).toFixed(2)}deg)`});
 stage.style.transform=`scale(${(1+0.022*cl((t-sc[1])/10)).toFixed(4)})`;
 let cv=0,cx=0;for(const tt of TROCAS){const p=(t-tt+0.45)/0.9;if(p>0&&p<1){cv=Math.sin(Math.PI*p);cx=-500+1000*p}}
 $('#cortina').style.opacity=((D.TEMA==='creme'?0.55:0.7)*cv).toFixed(3);$('#cortina').style.transform=`translateX(${cx.toFixed(1)}px)`;
 $('#cortina2').style.opacity=(0.45*cv).toFixed(3);$('#cortina2').style.transform=`translateX(${(-cx*0.6).toFixed(1)}px)`;
 const gi=D.LEG.findIndex(g=>t>=g.t0&&t<g.t1);
 if(gi!==legAtual){legAtual=gi;leg.innerHTML=gi<0?'':'<div class="cx">'+D.LEG[gi].p.map(w=>`<span class="${w.h?'h':''}">${w.w}</span>`).join('')+'</div>'}
 leg.classList.toggle('nacapa',t<S.p1-0.1);
 if(gi>=0){const p=t<S.p1-0.1?1:cl((t-D.LEG[gi].t0)/0.15);leg.style.opacity=p;leg.style.transform=`translateY(${(8*(1-eo(p))).toFixed(1)}px)`}else leg.style.opacity=0;
};
window.render(0);
</script></body></html>
