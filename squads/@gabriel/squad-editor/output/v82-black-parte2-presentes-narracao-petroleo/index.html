*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#020708}
#tudo{position:absolute;inset:0}
#bg{position:absolute;inset:0;background:radial-gradient(70% 42% at 50% 36%,#123c43 0%,#0A1F23 42%,#04100f 72%,#010405 100%)}
.fm{position:absolute;-webkit-mask-size:100% 100%}
#fm1{left:-300px;top:-150px;width:1700px;height:1500px;-webkit-mask-image:url(fumaca/fumaca_a.png);background:#5f8f88;opacity:.12}
#fm2{left:-400px;top:300px;width:1800px;height:1500px;-webkit-mask-image:url(fumaca/fumaca_b.png);background:var(--amb);opacity:.18}
#fm3{left:-250px;top:800px;width:1600px;height:1200px;-webkit-mask-image:url(fumaca/fumaca_a.png);background:var(--cre);opacity:.05}
#notas{position:absolute;inset:0}
#notas img{position:absolute;filter:blur(1.3px) saturate(1.05) brightness(1.08) drop-shadow(0 0 3px rgba(242,232,216,.55)) drop-shadow(0 0 30px rgba(242,232,216,.35))}

#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 700px}
.e{position:absolute;opacity:0;display:none}
.e img{display:block}
/* capa (quadro 0 = capa do feed: tudo entre y 260 e 1660) */

#ctxt{position:absolute;left:0;right:0;top:280px;text-align:center}
.cparte{display:inline-block;font-family:MB;font-size:36px;letter-spacing:8px;text-indent:8px;padding:12px 34px 10px;border-radius:999px;background:var(--ama);color:var(--noite);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.c1{margin-top:30px;font-family:MV;font-weight:900;font-size:112px;line-height:.95;color:var(--cre);text-shadow:0 5px 22px #000e}
.c2{font-family:GB;font-size:170px;line-height:1.02;background:linear-gradient(180deg,#FFE9B8 0,#F2C978 40%,#D49A4E 72%,#A86F2C 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px #000c)}
.cpil{display:inline-block;margin-top:30px;padding:14px 38px 16px;border-radius:60px;font-family:MB;font-size:50px;background:var(--ama);color:var(--noite);box-shadow:0 10px 30px #0009;transform:rotate(-2deg)}
#cq{position:absolute;left:0;right:0;top:860px;height:420px;display:flex;justify-content:center;align-items:flex-end;gap:22px}
#cq .q5{width:180px;height:280px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:GB;font-size:140px;color:var(--pet);box-shadow:0 18px 34px rgba(0,0,0,.5),0 0 0 3px rgba(212,154,78,.6);position:relative}
#cq .q5 i{position:absolute;top:-46px;left:0;right:0;text-align:center;font-style:normal;font-size:70px}
/* selo fixo no topo durante a lista */
.selo{left:0;right:0;text-align:center}
.selo span{display:inline-block;font-family:MB;font-size:30px;letter-spacing:3px;color:var(--noite);background:var(--ama);border-radius:999px;padding:11px 28px 9px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.rank{left:0;right:0;text-align:center;font-family:GB;color:var(--cre);font-size:44px;letter-spacing:8px;text-shadow:0 6px 24px rgba(0,0,0,.6)}
.rank b{font-family:MV;font-weight:900;font-size:104px;letter-spacing:0;vertical-align:-14px;margin-right:16px;background:linear-gradient(180deg,#FFE9B8 0,#F2C978 40%,#D49A4E 72%,#A86F2C 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px #000c)}
.nome{left:0;right:0;text-align:center;font-family:GB;font-size:76px;line-height:1.05;color:var(--cre);text-shadow:0 5px 0 rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.5)}
.marca{left:0;right:0;text-align:center;font-family:MBo;font-size:30px;letter-spacing:12px;color:var(--amb)}
.glow{width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(212,154,78,.34) 0%,rgba(212,154,78,.10) 40%,rgba(212,154,78,0) 68%)}
.acard{padding:18px;background:#fff;border-radius:26px;box-shadow:0 26px 40px rgba(0,0,0,.55),0 0 0 4px rgba(212,154,78,.7)}
.gr{text-align:center;width:340px}
.gr .chip{display:inline-block;white-space:nowrap;font-family:MB;font-size:23px;letter-spacing:3px;color:var(--noite);background:var(--cre);border-radius:999px;padding:9px 20px 7px}
.gr b{display:block;font-family:GB;font-size:34px;color:var(--cre);margin-top:14px;line-height:1.05}
.gr small{display:block;font-family:MBo;font-size:20px;letter-spacing:5px;color:var(--amb);margin-top:6px}
.gcard{display:inline-block;margin-top:18px;padding:16px;background:#fff;border-radius:22px;box-shadow:0 18px 34px rgba(0,0,0,.55),0 0 0 3px rgba(212,154,78,.55)}
.gcard img{margin:0!important}
.nt{text-align:center;width:180px}
.nt .ib{height:120px;display:flex;align-items:flex-end;justify-content:center}
.nt img{max-width:150px;max-height:120px;filter:drop-shadow(0 0 3px rgba(242,232,216,.7)) drop-shadow(0 0 18px rgba(242,232,216,.5)) drop-shadow(0 12px 18px rgba(0,0,0,.55))}
.nt .lab{margin-top:10px;font-family:MB;font-size:21px;letter-spacing:2px;color:var(--cre);line-height:1.15;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.tag{font-family:MB;font-size:32px;border-radius:999px;padding:15px 32px 13px;white-space:nowrap;text-align:center;display:inline-block;line-height:1.1}
.tag.out{color:var(--cre);border:3px solid var(--amb);background:rgba(5,15,16,.75)}
.tag.cre{color:var(--noite);background:var(--cre);box-shadow:0 8px 22px rgba(0,0,0,.4)}

.big{left:0;right:0;text-align:center;font-family:GB;font-size:150px;line-height:1;background:linear-gradient(180deg,#FFE9B8 0,#F2C978 40%,#D49A4E 72%,#A86F2C 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px #000c)}
