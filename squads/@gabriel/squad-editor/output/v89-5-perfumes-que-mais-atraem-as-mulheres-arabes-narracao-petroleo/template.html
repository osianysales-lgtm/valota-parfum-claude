<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
/* Black Friday · Parte 1 (creme) / Parte 2 (petróleo) · molde guia-carrossel do v80 com frascos em CARD BRANCO (sem recorte) */
@font-face{font-family:MX;src:url(fontes/Montserrat-ExtraBold.ttf)}
@font-face{font-family:MBo;src:url(fontes/Montserrat-Bold.ttf)}
@font-face{font-family:MB;src:url(fontes/Montserrat-Black.ttf)}
@font-face{font-family:MV;src:url(fontes/Montserrat-VariableFont_wght.ttf)}
@font-face{font-family:GB;src:url(fontes/GothamBlack.otf)}
:root{--pet:#0F2E33;--luz:#1A4A52;--amb:#D49A4E;--cre:#F2E8D8;--ama:#FFC93C;--noite:#0A1F23;--pim:#9C452A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#020708}
#tudo{position:absolute;inset:0}
#bg{position:absolute;inset:0;background:radial-gradient(70% 42% at 50% 36%,#123c43 0%,#0A1F23 42%,#04100f 72%,#010405 100%)}
.fm{position:absolute;-webkit-mask-size:100% 100%}
#fm1{left:-300px;top:-150px;width:1700px;height:1500px;-webkit-mask-image:url(fumaca/fumaca_a.png);background:#5f8f88;opacity:.12}
#fm2{left:-400px;top:300px;width:1800px;height:1500px;-webkit-mask-image:url(fumaca/fumaca_b.png);background:var(--amb);opacity:.18}
#fm3{left:-250px;top:800px;width:1600px;height:1200px;-webkit-mask-image:url(fumaca/fumaca_a.png);background:var(--cre);opacity:.05}
#notas{position:absolute;inset:0}
#notas img{position:absolute;filter:blur(1.3px) saturate(1.05) brightness(1.08) drop-shadow(0 0 3px rgba(242,232,216,.55)) drop-shadow(0 0 30px rgba(242,232,216,.35))}
#vin{position:absolute;inset:0;background:radial-gradient(80% 58% at 50% 42%,rgba(0,0,0,0) 50%,rgba(0,0,0,.78) 100%)}
#moldura{position:absolute;left:16px;top:16px;right:16px;bottom:16px;border:2px solid rgba(212,154,78,.32);border-radius:36px;pointer-events:none}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 700px}
.e{position:absolute;opacity:0;display:none}
.e img{display:block}
/* capa (quadro 0 = capa do feed: tudo entre y 260 e 1660) */
#capa{position:absolute;inset:0;overflow:hidden;background:radial-gradient(70% 42% at 50% 36%,#123c43 0%,#0A1F23 42%,#04100f 72%,#010405 100%)}
#ctxt{position:absolute;left:0;right:0;top:280px;text-align:center}
.cparte{display:inline-block;font-family:MB;font-size:36px;letter-spacing:8px;text-indent:8px;padding:12px 34px 10px;border-radius:999px;background:var(--ama);color:var(--noite);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.c1{margin-top:30px;font-family:MV;font-weight:900;font-size:112px;line-height:.95;color:var(--cre);text-shadow:0 5px 22px #000e}
.c2{font-family:GB;font-size:170px;line-height:1.02;background:linear-gradient(180deg,#FFE9B8 0,#F2C978 40%,#D49A4E 72%,#A86F2C 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px #000c)}
.cpil{display:inline-block;margin-top:30px;padding:14px 38px 16px;border-radius:60px;font-family:MB;font-size:50px;background:var(--ama);color:var(--noite);box-shadow:0 10px 30px #0009;transform:rotate(-2deg)}
#cq{position:absolute;left:0;right:0;top:860px;height:420px;display:flex;justify-content:center;align-items:flex-end;gap:22px}
#cq .q5{width:180px;height:280px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:GB;font-size:140px;color:var(--pet);box-shadow:0 18px 34px rgba(0,0,0,.5),0 0 0 3px rgba(212,154,78,.6);position:relative}
#cq .q5 i{position:absolute;top:-46px;left:0;right:0;text-align:center;font-style:normal;font-size:70px}
/* selo fixo no topo durante a lista */
.selo{left:0;right:0;text-align:center}
.selo span{display:inline-block;font-family:MB;font-size:30px;letter-spacing:3px;color:var(--noite);background:var(--ama);border-radius:999px;padding:11px 28px 9px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.rank{left:0;right:0;text-align:center;font-family:GB;color:var(--cre);font-size:44px;letter-spacing:8px;text-shadow:0 6px 24px rgba(0,0,0,.6)}
.rank b{font-family:MV;font-weight:900;font-size:104px;letter-spacing:0;vertical-align:-14px;margin-right:16px;background:linear-gradient(180deg,#FFE9B8 0,#F2C978 40%,#D49A4E 72%,#A86F2C 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px #000c)}
.nome{left:0;right:0;text-align:center;font-family:GB;font-size:76px;line-height:1.05;color:var(--cre);text-shadow:0 5px 0 rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.5)}
.marca{left:0;right:0;text-align:center;font-family:MBo;font-size:30px;letter-spacing:12px;color:var(--amb)}
.glow{width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(212,154,78,.34) 0%,rgba(212,154,78,.10) 40%,rgba(212,154,78,0) 68%)}
.acard{padding:18px;background:#fff;border-radius:26px;box-shadow:0 26px 40px rgba(0,0,0,.55),0 0 0 4px rgba(212,154,78,.7)}
.gr{text-align:center;width:340px}
.gr .chip{display:inline-block;white-space:nowrap;font-family:MB;font-size:23px;letter-spacing:3px;color:var(--noite);background:var(--cre);border-radius:999px;padding:9px 20px 7px}
.gr b{display:block;font-family:GB;font-size:34px;color:var(--cre);margin-top:14px;line-height:1.05}
.gr small{display:block;font-family:MBo;font-size:20px;letter-spacing:5px;color:var(--amb);margin-top:6px}
.gcard{display:inline-block;margin-top:18px;padding:16px;background:#fff;border-radius:22px;box-shadow:0 18px 34px rgba(0,0,0,.55),0 0 0 3px rgba(212,154,78,.55)}
.gcard img{margin:0!important}
.nt{text-align:center;width:180px}
.nt .ib{height:120px;display:flex;align-items:flex-end;justify-content:center}
.nt img{max-width:150px;max-height:120px;filter:drop-shadow(0 0 3px rgba(242,232,216,.7)) drop-shadow(0 0 18px rgba(242,232,216,.5)) drop-shadow(0 12px 18px rgba(0,0,0,.55))}
.nt .lab{margin-top:10px;font-family:MB;font-size:21px;letter-spacing:2px;color:var(--cre);line-height:1.15;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.tag{font-family:MB;font-size:32px;border-radius:999px;padding:15px 32px 13px;white-space:nowrap;text-align:center;display:inline-block;line-height:1.1}
.tag.out{color:var(--cre);border:3px solid var(--amb);background:rgba(5,15,16,.75)}
.tag.cre{color:var(--noite);background:var(--cre);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.tag.ama{color:var(--noite);background:var(--ama);box-shadow:0 0 34px rgba(255,201,60,.35),0 8px 22px rgba(0,0,0,.35)}
.tag.pim{color:var(--cre);background:var(--pim);box-shadow:0 0 30px rgba(156,69,42,.45),0 8px 22px rgba(0,0,0,.4)}
.grupo{padding:14px;background:#fff;border-radius:26px;box-shadow:0 26px 44px rgba(0,0,0,.55),0 0 0 4px rgba(212,154,78,.7)}
.grupo img{border-radius:14px}
.big{left:0;right:0;text-align:center;font-family:GB;font-size:150px;line-height:1;background:linear-gradient(180deg,#FFE9B8 0,#F2C978 40%,#D49A4E 72%,#A86F2C 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px #000c)}
.mq{width:150px;height:220px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:GB;font-size:100px;color:var(--pet);box-shadow:0 16px 30px rgba(0,0,0,.5),0 0 0 3px rgba(212,154,78,.6)}
.mini{padding:10px;background:#fff;border-radius:16px;box-shadow:0 14px 26px rgba(0,0,0,.5),0 0 0 3px rgba(212,154,78,.55)}
/* legenda (obrigatória) */
#leg{position:absolute;left:50px;right:50px;top:1468px;height:90px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
#leg span{font-family:MV;font-weight:700;font-size:44px;color:var(--cre);margin:0 7px;display:inline-block;text-shadow:0 3px 12px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8)}
#leg span.h{color:var(--ama);font-weight:800}
#leg .cx{display:inline-block;padding:8px 26px 10px;border-radius:22px}
#leg.nacapa .cx{background:rgba(4,12,14,.93);box-shadow:0 10px 30px rgba(0,0,0,.55);border:2px solid rgba(212,154,78,.35)}
#cortina{position:absolute;left:-260px;top:-60px;width:1600px;height:2000px;-webkit-mask-image:url(fumaca/fumaca_b.png);-webkit-mask-size:100% 100%;background:#9fb8b3;opacity:0}
#cortina2{position:absolute;left:-200px;top:0;width:1500px;height:1900px;-webkit-mask-image:url(fumaca/fumaca_a.png);-webkit-mask-size:100% 100%;background:var(--amb);opacity:0}

/* ===== TEMA CREME (fundo claro = fontes grossas, texto Petróleo Noite, nada de texto âmbar/amarelo sobre o creme) ===== */
body.creme{background:#E9DCC6}
.creme #bg,.creme #capa{background:radial-gradient(70% 45% at 50% 36%,#FBF5EA 0%,#F2E8D8 52%,#E4D3B8 100%)}
.creme #fm1{background:#7FA8A1;opacity:.10}
.creme #fm2{opacity:.13}
.creme #fm3{background:#B98A5A;opacity:.07}
.creme #notas img{filter:blur(1.2px) saturate(1.05) drop-shadow(0 10px 18px rgba(10,31,35,.18))}
.creme #vin{background:radial-gradient(80% 58% at 50% 42%,rgba(0,0,0,0) 55%,rgba(110,80,40,.20) 100%)}
.creme #moldura{border-color:rgba(15,46,51,.28)}
.creme .cparte{background:var(--noite);color:var(--cre);box-shadow:0 8px 20px rgba(10,31,35,.25)}
.creme .c1{color:var(--noite);text-shadow:none}
.creme .c2{background:none;color:var(--noite);-webkit-background-clip:border-box;filter:none}
.creme .cpil{background:var(--pet);color:var(--cre);box-shadow:0 10px 26px rgba(10,31,35,.3)}
.creme #cq .q5{box-shadow:0 16px 30px rgba(10,31,35,.22),0 0 0 3px var(--pet)}
.creme .selo span{background:var(--noite);color:var(--cre);box-shadow:0 8px 20px rgba(10,31,35,.25)}
.creme .rank{color:var(--noite);text-shadow:none}
.creme .rank b{background:linear-gradient(180deg,#1A4A52 0,#0F2E33 55%,#0A1F23 100%);-webkit-background-clip:text;filter:none}
.creme .nome{color:var(--noite);text-shadow:none}
.creme .marca{color:var(--pim);font-family:MB}
.creme .glow{background:radial-gradient(circle,rgba(212,154,78,.30) 0%,rgba(212,154,78,.08) 40%,rgba(212,154,78,0) 68%)}
.creme .acard{box-shadow:0 24px 40px rgba(10,31,35,.25),0 0 0 4px var(--pet)}
.creme .gcard,.creme .grupo,.creme .mini,.creme .mq{box-shadow:0 16px 30px rgba(10,31,35,.22),0 0 0 3px var(--pet)}
.creme .gr .chip{background:var(--noite);color:var(--cre)}
.creme .gr b{color:var(--noite)}
.creme .gr small{color:var(--pim);font-family:MB}
.creme .nt img{filter:drop-shadow(0 10px 14px rgba(10,31,35,.25))}
.creme .nt .lab{color:var(--noite);font-family:MB;text-shadow:none}
.creme .tag.out{color:var(--noite);border-color:var(--noite);background:rgba(255,255,255,.75)}
.creme .tag.cre{color:var(--cre);background:var(--noite);box-shadow:0 8px 20px rgba(10,31,35,.25)}
.creme .tag.ama{box-shadow:0 8px 20px rgba(10,31,35,.22)}
.creme .big{background:none;color:var(--noite);-webkit-background-clip:border-box;filter:none}
.creme #leg span{color:var(--noite);font-weight:800;text-shadow:none}
.creme #leg span.h{color:var(--noite);background:linear-gradient(180deg,rgba(212,154,78,0) 52%,rgba(212,154,78,.65) 52%,rgba(212,154,78,.65) 92%,rgba(212,154,78,0) 92%);padding:0 4px}
.creme #leg .cx{background:rgba(255,255,255,.82);box-shadow:0 8px 22px rgba(10,31,35,.15)}
.creme #leg.nacapa .cx{background:rgba(255,255,255,.95);border:2px solid rgba(15,46,51,.25)}
.creme #cortina{background:#ffffff}
</style></head><body>
<div id="tudo">
<div id="bg"></div><div id="fm1" class="fm"></div><div id="fm2" class="fm"></div><div id="fm3" class="fm"></div>
<div id="notas"></div><div id="vin"></div>
<div id="stage"></div>
<div id="capa"><div id="ctxt"></div><div id="cq"></div></div>
<div id="cortina"></div><div id="cortina2"></div>
<div id="leg"></div>
<div id="moldura"></div>
</div>
<script>
/*DADOS*/
const D=window.D,K=D.K,S=D.S,$=s=>document.querySelector(s),stage=$('#stage');
if(D.TEMA==='creme')document.body.classList.add('creme');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=p=>1-Math.pow(1-p,3);
const back=p=>{const c=1.7;p=cl(p);return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const L=window.__L=[];
function E(html,css,t0,t1,fx='pop',extra={}){const d=document.createElement('div');d.className='e '+(extra.cls||'');d.innerHTML=html;Object.assign(d.style,css||{});stage.appendChild(d);const o={d,t0,t1,fx,...extra};L.push(o);return o}
const pos=(x,y,extra={})=>Object.assign({left:x+'px',top:y+'px'},extra);
const centro=(y,extra={})=>Object.assign({left:'0',right:'0',top:y+'px',textAlign:'center'},extra);
const AR=D.AR;
// card branco do frasco (sem recorte): cx = centro, yb = base do card
const acard=(img,cx,yb,h,t0,t1,fx='pop')=>{const w=Math.round(h*AR[img]);return E(`<div class="acard"><img src="frascos/cards/${img}.jpg" style="width:${w}px;height:${h}px"></div>`,pos(cx-(w+36)/2,yb-h-36),t0,t1,fx)};

// ---------- capa
$('#ctxt').innerHTML=D.CAPA.html;
D.CAPA.q.forEach(lac=>{const d=document.createElement('div');d.className='q5';d.innerHTML=(lac?'<i>'+lac+'</i>':'')+'?';$('#cq').appendChild(d)});

const BGPOS=[[-60,165,300],[790,140,300],[-90,600,280],[830,590,290],[-50,1040,250],[850,1010,260],[40,1290,210],[830,1300,220],[-30,1590,280],[400,1680,240],[790,1600,290]];
const bgNotas=[];
const addBg=(lista,t0,t1)=>BGPOS.forEach(([x,y,w],i)=>{const im=document.createElement('img');im.src=`notas/${lista[i%lista.length]}.png`;im.style.left=x+'px';im.style.top=y+'px';im.style.width=w+'px';im.style.opacity=0;$('#notas').appendChild(im);bgNotas.push({im,t0,t1,ph:i*1.3+t0})});

// selos fixos no topo (podem trocar no meio: PRA ELA → PRA ELE)
D.SELOS.forEach(([tx,t0,t1])=>E(`<span>${tx}</span>`,{top:'52px'},t0,t1,'fade',{cls:'selo'}));

// ---------- os 5 perfumes
const PF=D.PF;
PF.forEach(p=>{
 const {t0,t1}=p,sh=p.show;
 addBg(p.bg||p.notas.map(n=>n[0]),t0,t1);
 E(`<b>${p.n}</b>DE 5`,{top:'128px'},p.rank||sh,t1,'up',{cls:'rank'});
 const longo=p.nome.length>13;
 E(p.nome,{top:'284px',fontSize:longo?'64px':'76px'},sh+0.08,t1,'up',{cls:'nome'});
 E(p.marca,{top:longo?'364px':'374px'},sh+0.16,t1,'fade',{cls:'marca'});
 const so=!p.g, cx=so?540:320, h=so?580:540, yb=1060;
 E('',pos(cx-380,yb-680),sh,t1,'fade',{cls:'glow',pulse:1,nq:1});
 acard(p.img,cx,yb,h,sh+0.1,t1,'pop');
 if(!so){const gh=300,gw=Math.round(gh*AR[p.g]);
  E(`<span class="chip">${p.chip}</span><b>${p.gnome}</b><small>${p.gmarca}</small><div class="gcard"><img src="frascos/cards/${p.g}.jpg" style="width:${gw}px;height:${gh}px"></div>`,pos(590,450),p.tl,t1,'pop',{cls:'gr'});}
 const n=p.notas.length,esp=200,x0=540-(n*esp)/2;
 p.notas.forEach(([img,lab,t],i)=>E(`<div class="ib"><img src="notas/${img}.png"></div><div class="lab">${lab}</div>`,pos(x0+i*esp+10,1100),t,t1,'pop',{cls:'nt'}));
 p.pills.forEach(([tx,t,c])=>E(`<span class="tag ${c}">${tx}</span>`,centro(1330),t,t1,'pop'));
});

(D.EXTRAS||[]).forEach(([h,y,t0,t1])=>E(h,centro(y),t0,t1,'pop'));
if(D.CTA){
// ---------- CTA do grupo
const C=D.CTA;

E('<span class="tag pim" style="font-family:GB;font-size:46px;padding:20px 40px 14px">⚠️ CUIDADO COM OFERTA FALSA</span>',centro(250,{transform:'rotate(-3deg)'}),K.c_falsa,S.fim,'stamp',{rot:-3});
E('<div class="grupo"><img src="grupo-whatsapp.png" style="width:600px;height:459px"></div>',pos(540-314,400),K.c_grupo,S.fim,'pop');
E('<span class="tag ama" style="font-family:GB;font-size:54px;padding:22px 52px 16px">👉 LINK NA BIO</span>',centro(920),K.c_link,S.fim,'pop');
E('<span class="tag out" style="font-size:32px">SEM ÁRABE FALSO, SEM OFERTA FALSA.</span>',centro(1050),K.c_slogan,S.fim,'pop');
E(`<span class="tag cre" style="font-size:36px">${C.presente}</span>`,centro(1160),K.c_presente,S.fim,'pop');

}
addBg(D.BG_FIM,S.fim,D.END+1);
// ---------- fim: chamada da outra parte
const F=D.FIM_PARTE;
E(F.chip,centro(250),S.fim,D.END+1,'pop');
E(F.big,{top:'360px'},S.fim+0.1,D.END+1,'pop',{cls:'big'});
E(`<span class="tag ama" style="font-size:33px">${F.linha}</span>`,centro(540),K.f_linha,D.END+1,'pop');
F.cards.forEach(([img,lac],i)=>{const tot=F.cards.length,esp=tot>3?190:250,cx=540-((tot-1)*esp)/2+i*esp;
 if(img){const h=200,w=Math.round(h*AR[img]);E(`<div class="mini"><img src="frascos/cards/${img}.jpg" style="width:${w}px;height:${h}px"></div>`,pos(cx-(w+20)/2,700),K.f_cards+i*0.08,D.END+1,'pop')}
 else E(`<div class="mq" style="position:relative"><i style="position:absolute;top:-44px;left:0;right:0;text-align:center;font-style:normal;font-size:64px">${lac}</i>?</div>`,pos(cx-75,720),K.f_cards+i*0.08,D.END+1,'pop')});
E(`<span class="tag out" style="font-size:34px">${F.rodape}</span>`,centro(1040),K.f_rodape,D.END+1,'pop');
if(F.rodape2)E(`<span class="tag cre" style="font-size:34px">${F.rodape2}</span>`,centro(1150),K.f_rodape2,D.END+1,'pop');

// ---------- render
const SC=[['capa',0,S.p1],...PF.map(p=>[p.k,p.t0,p.t1]),...(D.CTA?[['cta',S.cta,S.fim]]:[]),['fim',S.fim,D.END+1]];
const FMC={capa:'#D49A4E',cta:'#9C452A',fim:'#D49A4E'};PF.forEach(p=>FMC[p.k]=p.fm);
const leg=$('#leg');let legAtual=-1;
const TROCAS=[S.p1,...PF.slice(1).map(p=>p.t0),...(D.CTA?[S.cta]:[]),S.fim];
window.render=function(t){
 for(const o of L){
  const vis=t>=o.t0&&t<o.t1;const pin=cl((t-o.t0)/0.38),pout=cl((t-(o.t1-0.2))/0.2);
  if(!vis){o.d.style.opacity=0;o.d.style.display='none';continue}
  o.d.style.display='block';
  let op=1,tr='';
  switch(o.fx){
   case 'pop':op=cl(pin*2.2);tr=`scale(${(0.6+0.4*back(pin)).toFixed(4)})`;break;
   case 'up':op=eo(pin);tr=`translateY(${(34*(1-eo(pin))).toFixed(1)}px)`;break;
   case 'fade':op=eo(pin);break;
   case 'stamp':{const p=cl((t-o.t0)/0.26);op=cl(p*3);tr=`scale(${(1.6-0.6*eo(p)).toFixed(4)})`;break}
  }
  op*=1-pout;
  if(o.rot!=null)tr+=` rotate(${o.rot}deg)`;
  if(o.pulse)tr+=` scale(${(1+0.04*Math.sin(t*2.4)).toFixed(4)})`;
  o.d.style.opacity=op.toFixed(3);o.d.style.transform=tr;
 }
 const cf=cl((t-S.p1+0.25)/0.5);$('#capa').style.opacity=(1-cf).toFixed(3);$('#capa').style.display=cf>=1?'none':'block';
 document.querySelectorAll('#cq .q5').forEach((s,i)=>{s.style.transform=`translateY(${(6*Math.sin(t*2+i)).toFixed(1)}px) rotate(${(i%2?3:-3)}deg)`});
 const sc=SC.find(s=>t>=s[1]&&t<s[2])||SC[0];
 $('#fm2').style.background=FMC[sc[0]];
 $('#fm1').style.transform=`translate(${(60*Math.sin(t*0.11)).toFixed(1)}px,${(-30*t/60).toFixed(1)}px) rotate(${(3*Math.sin(t*0.07)).toFixed(2)}deg)`;
