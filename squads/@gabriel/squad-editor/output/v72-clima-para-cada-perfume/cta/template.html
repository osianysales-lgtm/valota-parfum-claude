<!doctype html>
<html><head><meta charset="utf-8">
<!-- v72 · CTA "salva + segue": cartão do perfil @valotaparfum + 3 últimas postagens.
     window.DADOS (perfil/posts/números) e window.render(t) são chamados pelo gerar_cta.js, quadro a quadro. -->
<style>
@font-face{font-family:M;src:url('../fonts/Montserrat-VF.ttf');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:M,sans-serif}
#fundo{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.42) saturate(.8)}
.titulo{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;line-height:1.02;letter-spacing:-1px;
  color:#F6C801;-webkit-text-stroke:12px #0d0d0d;paint-order:stroke fill;white-space:nowrap}
#t1{top:300px;font-size:104px}
#t1b{top:410px;font-size:72px;color:#fff}
#t2{top:300px;font-size:104px}
#t2b{top:418px;font-size:62px;color:#fff}
.ico{font-family:'Apple Color Emoji';-webkit-text-stroke:0;font-size:86px;vertical-align:-8px}
#card{position:absolute;left:60px;top:560px;width:960px;background:#fff;border-radius:46px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.55);padding:48px 44px 0}
.topo{display:flex;align-items:center;gap:44px}
.anel{width:206px;height:206px;border-radius:50%;padding:7px;flex:none;
  background:conic-gradient(from 210deg,#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5,#FEDA75)}
.anel div{width:100%;height:100%;border-radius:50%;border:7px solid #fff;background-size:cover;background-position:center 30%}
.nums{display:flex;flex:1;justify-content:space-around;text-align:center}
.nums b{display:block;font-size:50px;font-weight:800;color:#111;line-height:1.1}
.nums span{font-size:29px;font-weight:500;color:#333}
.lado{flex:1;display:none}body.semnum .lado{display:block}body.semnum .user{margin-top:0;font-size:46px}
body.semnum .bio{font-size:32px;margin-top:10px}
.user{margin-top:26px;font-size:40px;font-weight:800;color:#111}
.bio{margin-top:6px;font-size:31px;font-weight:500;color:#333;line-height:1.3}
.botoes{display:flex;gap:16px;margin-top:30px}
.bt{flex:1;height:84px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700}
#seguir{background:#0095F6;color:#fff;transform-origin:center}
#seguir.ok{background:#EFEFEF;color:#111}
.msg{background:#EFEFEF;color:#111}
.grade{display:flex;gap:6px;margin:34px -44px 0;padding:0}
.post{flex:1;aspect-ratio:3/4;background-size:cover;background-position:center;position:relative;transform-origin:center bottom}

.post.luz{outline:8px solid #F6C801;outline-offset:-8px;z-index:2}
#dedo{position:absolute;font-family:'Apple Color Emoji';font-size:150px;line-height:1;transform-origin:30% 10%;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
#onda{position:absolute;border-radius:50%;border:8px solid rgba(255,255,255,.9);pointer-events:none}
</style></head><body>
<div id="fundo"></div>
<div class="titulo" id="t1"><span class="ico">🔖</span> SALVA</div>
<div class="titulo" id="t1b">PRA NÃO ESQUECER</div>
<div class="titulo" id="t2">E SEGUE <span class="ico">👇</span></div>
<div class="titulo" id="t2b">PRA MAIS DICAS COMO ESSA</div>
<div id="card">
  <div class="topo">
    <div class="anel"><div id="foto"></div></div>
    <div class="lado" id="lado"></div>
    <div class="nums">
      <div><b id="n_posts"></b><span>publicações</span></div>
      <div><b id="n_seg"></b><span>seguidores</span></div>
      <div><b id="n_sego"></b><span>seguindo</span></div>
    </div>
  </div>
  <div class="user" id="nome"></div>
  <div class="bio" id="bio"></div>
  <div class="botoes"><div class="bt" id="seguir">Seguir</div><div class="bt msg">Mensagem</div></div>
  <div class="grade"><div class="post" id="p0"></div><div class="post" id="p1"></div><div class="post" id="p2"></div></div>
</div>
<div id="dedo">👆</div>
<div id="onda"></div>
<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - cl(x), 3);
const mola = x => { x = cl(x); return 1 + Math.sin(x * Math.PI) * 0.12 * (1 - x); };
window.iniciar = D => {
  if (!D.mostrar_numeros) { const l = $('lado'); l.appendChild($('nome')); l.appendChild($('bio')); }
  window.D = D;
  $('fundo').style.backgroundImage = `url('${D.fundo}')`;
  $('foto').style.backgroundImage = `url('${D.avatar}')`;
  $('nome').textContent = D.nome; $('bio').textContent = D.bio;
  if (!D.mostrar_numeros) { document.querySelector('.nums').style.display = 'none'; document.body.classList.add('semnum'); }
  else { $('n_posts').textContent = D.publicacoes; $('n_seg').textContent = D.seguidores; $('n_sego').textContent = D.seguindo; }
  D.posts.forEach((p, i) => $('p' + i).style.backgroundImage = `url('${p}')`);
};
window.render = t => {
  const T = window.D.tempos;            // segundos do CTA (já com o corte do áudio)
  // cartão sobe
  const a = ease(t / 0.4);
  $('card').style.transform = `translateY(${(1 - a) * 900}px)`;
  // títulos: SALVA (até "siga") → E SEGUE
  const s1 = t >= T.salva && t < T.siga, s2 = t >= T.siga;
  const k1 = mola((t - T.salva) / 0.35), k2 = mola((t - T.siga) / 0.35);
  for (const [id, on, k] of [['t1', s1, k1], ['t1b', s1, k1], ['t2', s2, k2], ['t2b', s2, k2]]) {
    $(id).style.opacity = on ? 1 : 0; $(id).style.transform = `scale(${k})`;
  }
  // dedo entra e toca no Seguir no "siga"
  const bt = $('seguir').getBoundingClientRect();
  const alvoX = bt.left + bt.width * 0.5 - 40, alvoY = bt.top + 30;
  const d = ease((t - (T.siga - 0.45)) / 0.45);
  const sai = ease((t - (T.siga + 0.5)) / 0.4);
  $('dedo').style.left = (alvoX + (1 - d) * 380 + sai * 420) + 'px';
  $('dedo').style.top = (alvoY + (1 - d) * 520 + sai * 300) + 'px';
  const toque = t >= T.siga && t < T.siga + 0.18;
  $('dedo').style.transform = `scale(${toque ? 0.88 : 1})`;
  $('dedo').style.opacity = t < T.siga - 0.45 || sai >= 1 ? 0 : 1;
  const seguiu = t >= T.siga;
  $('seguir').className = 'bt' + (seguiu ? ' ok' : '');
  $('seguir').textContent = seguiu ? 'Seguindo ✓' : 'Seguir';
  $('seguir').style.transform = `scale(${seguiu ? mola((t - T.siga) / 0.3) : 1})`;
  if (window.D.mostrar_numeros) $('n_seg').textContent = seguiu ? window.D.seguidores_mais1 : window.D.seguidores;
  // onda do toque
  const o = (t - T.siga) / 0.45;
  $('onda').style.opacity = o > 0 && o < 1 ? (1 - o) : 0;
  const r = 40 + o * 120;
  $('onda').style.width = $('onda').style.height = 2 * r + 'px';
  $('onda').style.left = (bt.left + bt.width * 0.5 - r) + 'px';
  $('onda').style.top = (bt.top + bt.height * 0.5 - r) + 'px';
  // 3 postagens acendem uma a uma no "pra mais dicas como essa"
  T.posts.forEach((tp, i) => {
    const fim = i < T.posts.length - 1 ? T.posts[i + 1] : tp + 0.6;
    const on = t >= tp && t < fim;
    $('p' + i).className = 'post' + (on ? ' luz' : '');
    $('p' + i).style.transform = `scale(${on ? mola((t - tp) / 0.42) * 1.04 : 1})`;
  });
};
</script></body></html>
