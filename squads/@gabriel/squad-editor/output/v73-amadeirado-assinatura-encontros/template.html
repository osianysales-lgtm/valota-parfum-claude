<!doctype html>
<!-- v73 · AMADEIRADO / ASSINATURA / ENCONTROS · cópia do reel Df93Xk7x9oG, só o fundo trocado
     Fundo = template do "carrossel em vídeo" (v53 Club de Nuit / molde guia-carrossel): petróleo + fumaça tingida + notas flutuando
     Letra = igual à ref: Barlow Condensed ExtraBold Italic, branca, contorno preto, sombra leve -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:BC;src:url(fonts/BarlowCondensed-ExtraBoldItalic.ttf)}
:root{--pet:#0F2E33;--noite:#0A1F23;--luz:#1A4A52;--amb:#D49A4E;--cedro:#6B4430;--cre:#F2E8D8}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0A1F23}
#st{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;background:radial-gradient(75% 48% at 50% 46%,#1A4A52 0%,#0F2E33 45%,#0A1F23 78%,#061518 100%)}
.fm{position:absolute;-webkit-mask-size:100% 100%;mask-size:100% 100%}
#fm1{left:-300px;top:-200px;width:1700px;height:1300px;-webkit-mask-image:url(fumaca/fumaca_a.png);background:#a07c60;opacity:.50}
#fm2{left:-400px;top:450px;width:1800px;height:1200px;-webkit-mask-image:url(fumaca/fumaca_b.png);background:#7fb0a8;opacity:.36}
#fm3{left:-300px;top:1050px;width:1700px;height:1200px;-webkit-mask-image:url(fumaca/fumaca_a.png);background:var(--amb);opacity:.42}
#notas{position:absolute;inset:0}
#notas img{position:absolute;filter:blur(2.2px) saturate(.85) brightness(.9);opacity:.32}
#vin{position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
.gl{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(242,232,216,.16),rgba(26,74,82,.10) 55%,transparent 100%)}
.fr{position:absolute;display:flex;align-items:flex-end;justify-content:center}
.fr img{max-width:100%;max-height:100%;filter:drop-shadow(0 18px 22px rgba(0,0,0,.55))}
.tt{position:absolute;left:0;right:0;text-align:center;font-family:BC;color:#fff;font-size:107px;line-height:1;letter-spacing:.5px;
    -webkit-text-stroke:10px #000;paint-order:stroke fill;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}
</style></head><body><div id="st">
<div id="bg"></div><div id="fm1" class="fm"></div><div id="fm2" class="fm"></div><div id="fm3" class="fm"></div>
<div id="notas"></div><div id="vin"></div><div id="fr"></div><div id="tx"></div>
</div><script>
// caixas medidas no quadro da referência (x0,y0,x1,y1) · frasco encaixa por baixo, centralizado
const F=[
 ['01_hawas_black',113,333,327,728],['02_asad_elixir',477,352,630,718],['03_musamam_black_intense',815,330,978,738],
 ['04_supremacy_collectors',135,815,347,1190],['05_cdnim_limited',457,850,662,1185],['06_hawas_kobra',800,795,1012,1188],
 ['07_9pm_rebel',133,1318,332,1780],['08_liquid_brun',490,1318,662,1782],['09_asad_bourbon',820,1305,1027,1782]];
// títulos: topo da letra igual ao da ref (cap 262 / 770 / 1218), x do centro igual
const T=[['AMADEIRADO',250,543],['ASSINATURA',758,557],['ENCONTROS',1206,548]];
// notas flutuando no fundo (estilo carrossel em vídeo v53)
const N=[['canela',-60,30,330,-8],['cafe',800,10,300,10],['pimenta',-110,600,300,0],['abacaxi',900,520,250,6],
 ['baunilha',-120,1160,360,-14],['betula',880,1090,260,8],['patchouli',-40,1700,300,0],['cafe',760,1760,300,-18],
 ['canela',350,1000,170,20],['pimenta',640,1220,170,0]];
const $=s=>document.querySelector(s), H=(el,h)=>el.insertAdjacentHTML('beforeend',h);
N.forEach(([n,x,y,w,r],i)=>H($('#notas'),`<img id="n${i}" src="notas/${n}.png" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${r}deg)">`));
// brilho atrás de cada fileira (separa os frascos pretos do petróleo)
[[530,560],[1000,560],[1550,560]].forEach(([cy,ry])=>{});
F.forEach(([f,x0,y0,x1,y1])=>{const cx=(x0+x1)/2,cy=(y0+y1)/2,w=(x1-x0)*1.9,h=(y1-y0)*1.25;
 H($('#fr'),`<div class="gl" style="left:${cx-w/2}px;top:${cy-h/2}px;width:${w}px;height:${h}px"></div>`)});
F.forEach(([f,x0,y0,x1,y1])=>H($('#fr'),`<div class="fr" style="left:${x0}px;top:${y0}px;width:${x1-x0}px;height:${y1-y0}px"><img src="frascos/final/${f}.png"></div>`));
T.forEach(([t,y,cx])=>H($('#tx'),`<div class="tt" style="top:${y}px;left:${(cx-540)*2}px">${t}</div>`));
// t → quadro (fumaça e notas se mexendo devagar, frascos e letra parados igual à ref)
window.seek=t=>{
 $('#fm1').style.transform=`translate(${Math.sin(t*.35)*40+t*6}px,${Math.cos(t*.3)*20}px)`;
 $('#fm2').style.transform=`translate(${-t*8+Math.sin(t*.4)*30}px,${Math.sin(t*.25)*25}px)`;
 $('#fm3').style.transform=`translate(${t*7}px,${-Math.cos(t*.3)*25}px)`;
 // frascos flutuando de leve (pedido dela 22/11): sobe/desce 7 px + 0,8° de balanço, cada um num tempo,
 // período 3,35 s = 2 ciclos exatos em 6,7 s → o loop do reel não dá pulo
 const w=2*Math.PI/3.35;
 document.querySelectorAll('.fr').forEach((el,i)=>{const ph=i*0.9+(i%3)*0.5;
  el.style.transform=`translateY(${(Math.sin(w*t+ph)*7).toFixed(2)}px) rotate(${(Math.sin(w*t+ph+1.1)*0.8).toFixed(3)}deg)`});
 N.forEach(([n,x,y,w,r],i)=>{$('#n'+i).style.transform=`translate(${Math.sin(t*.6+i*1.3)*10}px,${Math.cos(t*.5+i)*14}px) rotate(${r+Math.sin(t*.4+i)*3}deg)`});
};
seek(0);
</script></body></html>
